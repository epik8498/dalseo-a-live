<!DOCTYPE html>

<title>성공드림 독립 관제판</title>
<style>
:root{--bg:#f4f7fb;--card:#fff;--soft:#f8fafc;--text:#101828;--muted:#667085;--line:#e4e7ec;--red:#ef233c;--blue:#2563eb;--green:#12b76a;--orange:#f79009;--purple:#7c3aed;--shadow:0 18px 45px rgba(16,24,40,.08);--radius:24px}
*{box-sizing:border-box}html,body{margin:0}body{background:radial-gradient(circle at top left,#edf6ff 0,#f7f9fc 34%,var(--bg) 100%);color:var(--text);font-family:Arial,'Noto Sans KR',sans-serif;font-weight:800}button,input,select{font-family:inherit}.wrap{max-width:1160px;margin:0 auto;padding:16px 14px 70px}.hero{position:sticky;top:0;z-index:20;background:rgba(244,247,251,.88);backdrop-filter:blur(14px);border-bottom:1px solid rgba(228,231,236,.75);padding:14px 0 12px;margin-bottom:18px}.hero-inner{display:flex;align-items:center;justify-content:space-between;gap:14px}.brand{display:flex;align-items:center;gap:12px}.logo{width:50px;height:50px;border-radius:17px;background:linear-gradient(135deg,var(--red),#ff6b7a);display:grid;place-items:center;color:#fff;font-size:23px;box-shadow:0 14px 28px rgba(239,35,60,.25)}.brand h1{margin:0;font-size:23px;letter-spacing:-.7px}.brand p{margin:4px 0 0;color:var(--muted);font-size:13px}.pill{border:1px solid var(--line);background:var(--card);border-radius:999px;padding:10px 14px;font-size:13px;color:var(--muted);box-shadow:0 8px 20px rgba(16,24,40,.04)}.region-tabs{display:flex;gap:7px;padding:5px;border:1px solid var(--line);border-radius:16px;background:var(--card);box-shadow:0 8px 20px rgba(16,24,40,.04)}.area-tab{border:0;border-radius:11px;background:transparent;color:var(--muted);padding:9px 15px;font-weight:1000;cursor:pointer}.area-tab.active{background:var(--red);color:#fff}.summary-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:18px}.summary-card{background:var(--card);border:1px solid var(--line);border-radius:20px;padding:16px 14px;min-height:105px;box-shadow:var(--shadow);position:relative;overflow:hidden}.summary-card:before{content:'';position:absolute;right:-26px;top:-26px;width:78px;height:78px;border-radius:50%;background:rgba(37,99,235,.07)}.summary-card.red:before{background:rgba(239,35,60,.09)}.summary-card.green:before{background:rgba(18,183,106,.1)}.summary-title{color:var(--muted);font-size:13px;line-height:1.25}.summary-value{margin-top:12px;font-size:27px;letter-spacing:-1px}.summary-value.red{color:var(--red)}.summary-value.green{color:var(--green)}.summary-value.blue{color:var(--blue)}.section{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow);padding:20px;margin:16px 0}.section-head{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:16px}.section-title{display:flex;align-items:center;gap:10px;font-size:21px;font-weight:1000;letter-spacing:-.5px}.bar{width:8px;height:26px;border-radius:999px;background:var(--red)}.toggle{border:0;background:var(--text);color:#fff;border-radius:14px;padding:12px 16px;font-weight:1000;cursor:pointer}.muted{color:var(--muted)}.hidden{display:none}.week-tabs{display:flex;gap:8px;flex-wrap:wrap;margin:0 0 14px}.week-tab{border:1px solid var(--line);background:#fff;color:var(--text);border-radius:999px;padding:10px 14px;font-size:13px;font-weight:1000;cursor:pointer}.week-tab.active{background:var(--red);border-color:var(--red);color:#fff;box-shadow:0 10px 22px rgba(239,35,60,.18)}.table-wrap{overflow-x:auto}.weekly-table,.team-table{width:100%;border-collapse:separate;border-spacing:0 8px;min-width:780px}.weekly-table th,.team-table th{font-size:12px;color:var(--muted);text-align:center;padding:0 8px 6px;white-space:nowrap}.weekly-table th:first-child,.weekly-table td:first-child,.team-table th:first-child,.team-table td:first-child{text-align:left}.weekly-table td,.team-table td{background:var(--soft);border-top:1px solid var(--line);border-bottom:1px solid var(--line);padding:13px 8px;text-align:center;font-size:14px;white-space:nowrap}.weekly-table td:first-child,.team-table td:first-child{border-left:1px solid var(--line);border-radius:14px 0 0 14px;font-size:16px;font-weight:1000}.weekly-table td:last-child,.team-table td:last-child{border-right:1px solid var(--line);border-radius:0 14px 14px 0}.oktxt{color:var(--green);font-weight:1000}.failtxt{color:var(--red);font-weight:1000}.badge{display:inline-flex;align-items:center;justify-content:center;border-radius:999px;padding:6px 10px;font-size:12px;font-weight:1000}.badge.ok{background:#e8fff3;color:#047a43}.badge.fail{background:#fff0f0;color:#d92d20}.badge.wait{background:#eef2f6;color:#475467}.period-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}.period-card{border:1px solid var(--line);border-radius:20px;background:linear-gradient(180deg,#fff,#fbfcfe);padding:16px}.period-name{font-size:17px}.period-main{font-size:26px;margin:14px 0 6px;letter-spacing:-.5px}.period-main span:first-child{color:var(--red)}.mini{font-size:12px;color:var(--muted)}.progress{height:12px;background:#eef2f6;border-radius:999px;overflow:hidden;margin:12px 0}.fill{height:100%;background:linear-gradient(90deg,var(--red),#ff7988);border-radius:999px}.period-result{border-top:1px solid var(--line);margin-top:13px;padding-top:12px;font-size:14px}.rider-tools{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px}.rider-tools input,.rider-tools select{border:1px solid var(--line);background:#fff;border-radius:14px;padding:13px 14px;font-weight:900}.rider-tools input{flex:1;min-width:180px}.rider-tools button{border:0;background:var(--red);color:#fff;border-radius:14px;padding:13px 16px;font-weight:1000;cursor:pointer}.rider-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}.rider{border:1px solid var(--line);border-radius:18px;background:#fff;padding:14px}.rider.online{border-color:rgba(18,183,106,.55);background:#f0fff7}.rider-top{display:flex;justify-content:space-between;gap:10px;align-items:center}.rider-name{font-size:19px}.status{font-size:12px;border-radius:999px;padding:6px 9px;background:#eef2f6;color:#475467}.online .status{background:#dcfae6;color:#067647}.rider-stats{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin-top:12px}.rstat{border-radius:12px;background:var(--soft);padding:10px 6px;text-align:center}.rstat small{display:block;color:var(--muted);font-size:11px}.rstat b{display:block;margin-top:5px;font-size:15px}.modal{position:fixed;inset:0;background:rgba(15,23,42,.55);z-index:60;display:none;align-items:center;justify-content:center;padding:16px}.modal.show{display:flex}.modal-card{width:min(820px,100%);max-height:86vh;overflow:auto;background:#fff;border-radius:24px;padding:20px;box-shadow:0 24px 80px rgba(0,0,0,.25)}.modal-head{display:flex;justify-content:space-between;gap:12px;align-items:center;margin-bottom:14px}.close{border:0;background:#111827;color:#fff;border-radius:12px;padding:10px 14px;font-weight:1000}.sms-team{border:1px solid var(--line);border-radius:20px;padding:14px;margin:12px 0;background:var(--soft)}.sms-group{border:1px solid var(--line);border-radius:16px;padding:13px;margin:10px 0;background:#fff}.sms-actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}.sms-actions button,.sms-actions a{border:0;background:var(--blue);color:#fff;border-radius:12px;padding:10px 12px;text-decoration:none;font-size:13px;font-weight:1000}.phone-list{word-break:break-all;color:var(--muted);line-height:1.6;font-size:13px}.manage-list{display:grid;grid-template-columns:1fr;gap:8px}.manage-row{display:flex;justify-content:space-between;align-items:center;gap:10px;border:1px solid var(--line);border-radius:14px;background:var(--soft);padding:12px}.manage-row b{font-size:16px}.manage-row select{border:1px solid var(--line);border-radius:10px;background:#fff;padding:9px 10px;font-weight:1000}.manage-actions{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px}.manage-actions button{border:1px solid var(--line);background:#fff;color:var(--text);border-radius:12px;padding:10px 12px;font-weight:1000;cursor:pointer}.manage-actions button.active{background:var(--red);border-color:var(--red);color:#fff}.manage-save{width:100%;border:0;background:var(--red);color:#fff;border-radius:14px;padding:13px 16px;font-weight:1000;cursor:pointer;margin:8px 0 14px}
@media(max-width:760px){.wrap{padding:10px 10px 60px}.hero-inner{align-items:flex-start}.brand h1{font-size:20px}.pill{display:none}.summary-grid{grid-template-columns:repeat(3,1fr);gap:7px}.summary-card{min-height:88px;padding:13px 8px;border-radius:16px}.summary-title{font-size:11.5px}.summary-value{font-size:20px;margin-top:10px}.section{padding:16px;border-radius:20px}.period-grid{grid-template-columns:1fr 1fr}.rider-grid{grid-template-columns:1fr}.rider-tools input,.rider-tools select,.rider-tools button{width:100%}}

.settlement-controls{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:14px}
.settlement-controls select{flex:1;min-width:180px;border:1px solid var(--line);background:#fff;border-radius:14px;padding:12px 13px;font-weight:1000}
.settlement-box{border:1px solid var(--line);border-radius:20px;background:linear-gradient(180deg,#fff,#fbfcfe);padding:18px}
.settlement-headline{text-align:center;margin-bottom:14px}
.settlement-headline strong{display:block;font-size:27px;color:var(--red);margin-top:6px}
.settlement-kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin:14px 0}
.settlement-kpi{background:var(--soft);border:1px solid var(--line);border-radius:14px;padding:12px 8px;text-align:center}
.settlement-kpi small{display:block;color:var(--muted);font-size:11px}
.settlement-kpi b{display:block;margin-top:5px;font-size:17px}
.settlement-money{border-top:2px solid var(--text);margin-top:14px;padding-top:10px}
.settlement-row{display:flex;justify-content:space-between;gap:12px;padding:9px 2px;border-bottom:1px solid var(--line);font-size:14px}
.settlement-row:last-child{border-bottom:0}.settlement-row.grand{font-size:18px;color:var(--red)}
.settlement-note{margin-top:12px;color:var(--muted);font-size:12px;line-height:1.55;text-align:center}
@media(max-width:760px){.settlement-kpis{grid-template-columns:1fr 1fr}.settlement-controls{flex-direction:column}}


/* 모바일 상단 권역 버튼 찌그러짐 방지 */
@media(max-width:760px){
  .hero{padding:10px 0 10px}
  .hero-inner{
    display:grid;
    grid-template-columns:1fr;
    gap:10px;
    align-items:stretch;
  }
  .brand{
    min-width:0;
    width:100%;
  }
  .brand>div:last-child{
    min-width:0;
  }
  .brand h1{
    font-size:18px;
    line-height:1.25;
    white-space:normal;
    word-break:keep-all;
  }
  .brand p{
    font-size:11px;
    white-space:nowrap;
    overflow:hidden;
    text-overflow:ellipsis;
  }
  .logo{
    width:42px;
    height:42px;
    min-width:42px;
    border-radius:14px;
    font-size:20px;
  }
  .region-tabs{
    width:100%;
    display:grid;
    grid-template-columns:repeat(2,minmax(0,1fr));
    gap:6px;
    padding:4px;
    border-radius:14px;
  }
  .area-tab{
    width:100%;
    min-width:0;
    padding:11px 6px;
    font-size:14px;
    line-height:1;
    white-space:nowrap;
    word-break:keep-all;
    text-align:center;
  }
  .section-head{
    align-items:center;
    gap:8px;
  }
  .section-title{
    min-width:0;
    font-size:18px;
    line-height:1.25;
  }
  .toggle{
    flex:0 0 auto;
    min-width:72px;
    padding:10px 11px;
    font-size:13px;
    white-space:nowrap;
  }
}


/* ===== VIC UI 개선 + 주간기록 상태 ===== */
:root{
  --ss-bg:#f4f6f8;--ss-surface:#fff;--ss-surface2:#f8fafc;--ss-text:#111827;
  --ss-sub:#6b7280;--ss-border:#e5e7eb;--ss-red:#e60012;
  --ss-shadow:0 8px 28px rgba(17,24,39,.07);--ss-shadow-sm:0 3px 14px rgba(17,24,39,.055)
}
body{background:radial-gradient(circle at 50% -120px,rgba(230,0,18,.07),transparent 380px),var(--ss-bg)!important;color:var(--ss-text)!important}
.wrap{max-width:1080px!important;padding:14px 14px 65px!important}
.hero{position:relative!important;top:auto!important;background:rgba(255,255,255,.9)!important;border:1px solid var(--ss-border)!important;border-radius:22px!important;padding:14px!important;box-shadow:var(--ss-shadow)!important;margin-bottom:12px!important}
.summary-grid{gap:8px!important}.summary-card{border:1px solid var(--ss-border)!important;border-radius:17px!important;box-shadow:var(--ss-shadow-sm)!important;min-height:92px!important;padding:13px 11px!important}.summary-card:before{display:none!important}.summary-title{font-size:11px!important}.summary-value{font-size:23px!important;margin-top:8px!important}
.section{border:1px solid var(--ss-border)!important;border-radius:18px!important;box-shadow:var(--ss-shadow-sm)!important;padding:16px!important;margin:12px 0!important}
.period-grid{gap:8px!important}.period-card{border-color:var(--ss-border)!important;border-radius:16px!important;padding:13px!important}.progress{height:7px!important}
.rider-grid{grid-template-columns:repeat(3,minmax(0,1fr))!important;gap:8px!important}.rider{border-color:var(--ss-border)!important;border-radius:16px!important;padding:13px!important;box-shadow:var(--ss-shadow-sm)!important}.rider-name{font-size:17px!important}.rstat{padding:8px 4px!important}.rstat small{font-size:10px!important}.rstat b{font-size:14px!important}
.weekly-save-ok,.weekly-save-warn{border-radius:13px;padding:10px 12px;margin:0 0 10px;font-size:12px;font-weight:1000}
.weekly-save-ok{background:#e9fbf2;border:1px solid #b7ead0;color:#087443}
.weekly-save-warn{background:#fff4e5;border:1px solid #ffd89a;color:#9a5b00}
@media(max-width:900px){.rider-grid{grid-template-columns:repeat(2,minmax(0,1fr))!important}}
@media(max-width:760px){.rider-grid{grid-template-columns:1fr!important}.summary-grid{grid-template-columns:repeat(3,minmax(0,1fr))!important}.period-grid{grid-template-columns:1fr 1fr!important}}
@media(max-width:540px){.wrap{padding:9px 9px 55px!important}.summary-card{min-height:84px!important;padding:11px 6px!important}.summary-title{font-size:10px!important}.summary-value{font-size:20px!important}.section{padding:12px!important}.rider-name{font-size:18px!important}.weekly-save-ok,.weekly-save-warn{font-size:11px;padding:9px 10px}}

</style>
</head>
<body>
<div class="wrap">
<header class="hero"><div class="hero-inner"><div class="brand"><div class="logo">S</div><div><h1>VIC 성공드림 관제판</h1><p id="topUpdate">업데이트 대기중</p></div></div><div class="region-tabs">
      <button id="areaBtnVic" class="area-tab active" onclick="switchArea('vic')">중구A</button>
      <button id="areaBtnDalseob" class="area-tab" onclick="switchArea('dalseob_onna')">달서B</button>
    </div></div></header>
<div id="errorBox"></div><div id="weeklySaveStatus"></div>
<section class="summary-grid" id="summaryGrid"></section>
<section class="section"><div class="section-head"><div class="section-title"><span class="bar"></span>이번주 현황 <span class="muted" id="weekRange"></span></div><button class="toggle" onclick="toggleWeekly()" id="weeklyBtn">보기 ▾</button></div><div id="weeklyPanel" class="hidden"><div class="week-tabs" id="weeklyTeamTabs"></div><div class="table-wrap"><table class="weekly-table" id="weeklyTable"></table></div></div></section>

<section class="section">
  <div class="section-head">
    <div class="section-title"><span class="bar"></span>주간 정산</div>
    <button class="toggle" onclick="toggleSettlement()" id="settlementBtn">보기 ▾</button>
  </div>
  <div id="settlementPanel" class="hidden">
    <div class="settlement-controls">
      <select id="settlementWeek" onchange="renderSettlement()"></select>
      <select id="settlementTeam" onchange="renderSettlement()"></select>
    </div>
    <div class="settlement-box" id="settlementBox"></div>
  </div>
</section>

<section class="section"><div class="section-head"><div class="section-title"><span class="bar"></span>시간대별 현황</div><span class="muted">완료 / 발주량</span></div><div class="period-grid" id="periodGrid"></div></section>
<section class="section"><div class="section-head"><div class="section-title"><span class="bar"></span>팀별 현황</div></div><div class="table-wrap"><table class="team-table" id="teamTable"></table></div></section>

<section class="section"><div class="section-head"><div class="section-title"><span class="bar"></span>기사이동</div><button class="toggle" onclick="toggleManage()" id="manageBtn">보기 ▾</button></div><div id="managePanel" class="hidden"><div class="manage-actions" id="manageFilters"></div><button class="manage-save" onclick="saveTeamMap()">팀 변경 저장</button><div class="manage-list" id="manageList">기사 목록 로딩중...</div></div></section>
<section class="section"><div class="section-head"><div class="section-title"><span class="bar"></span>라이더 현황</div></div><div class="rider-tools"><select id="riderTeamFilter" onchange="renderRiders()"><option value="전체">전체</option></select><input id="riderSearch" placeholder="라이더 이름 검색" oninput="renderRiders()" /><select id="riderSort" onchange="renderRiders()"><option value="complete">완료순</option><option value="reject">거절순</option><option value="name">가나다순</option></select><button onclick="openSmsModal()">단체문자</button></div><div class="rider-grid" id="riderGrid"></div></section>
</div>
<div class="modal" id="smsModal"><div class="modal-card"><div class="modal-head"><div><h2 style="margin:0">단체문자 그룹</h2><p class="muted" style="margin:6px 0 0">팀별로 나누고, 한 팀이 100명 이상이면 최대 99명씩 A/B/C 그룹으로 나눕니다.</p></div><button class="close" onclick="closeSmsModal()">닫기</button></div><div id="smsGroups"></div></div></div>
<script>
const FIREBASE_BASE='https://supersonic-l-default-rtdb.asia-southeast1.firebasedatabase.app';
const AREA_CONFIGS={
  vic:{label:'중구A',title:'VIC 성공드림 · 중구A 관제판',livePath:'/live/vic',weeklyPath:'/weekly/vic',teamOrder:['성공','상생','BM','서구','룰랄','미분류']},
  dalseob_onna:{label:'달서B',title:'VIC 성공드림 · 달서B 관제판',livePath:'/live/dalseob_onna',weeklyPath:'/weekly/dalseob_onna',teamOrder:['슈','넘','마','미분류']}
};
let AREA_KEY='vic';
let LIVE_PATH=AREA_CONFIGS.vic.livePath;
let WEEKLY_PATH=AREA_CONFIGS.vic.weeklyPath;
const TEAM_ORDER=[...AREA_CONFIGS.vic.teamOrder];
let WEEK_TEAM='성공';
let MANAGE_FILTER='전체';
const PERIODS=[['morning','오전'],['afternoon','오후'],['evening','저녁'],['midnight','심야']];
const PERIOD_LABEL={morning:'오전피크',afternoon:'오후논피크',evening:'저녁피크',midnight:'심야논피크'};
let DATA=null,WEEKLY=[];
function num(v){return Number(v||0)}function n(v){return num(v).toLocaleString('ko-KR')}function rate(c,b){c=num(c);b=num(b);return c+b?Math.round((c/(c+b))*1000)/10:100}function spare(c,b){return Math.floor(num(c)*.25)-num(b)}function bad(r){return num(r.reject||r.totalReject)+num(r.cancel||r.totalCancel)+num(r.riderFault)}function pct(a,b){return !num(b)?0:Math.min(100,Math.round(num(a)/num(b)*100))}function riders(){return DATA?.riders||[]}function teamObj(t){return DATA?.teams?.[t]||{summary:{},targets:{},riders:[]}}function teamRiders(t){return riders().filter(r=>r.team===t)}function onlineCount(list){return list.filter(r=>r.isOnline).length}function excluded(r){return num(r.excluded||0)}function currentPeriodLabel(){return DATA?.currentPeriodLabel||PERIOD_LABEL[DATA?.currentPeriod]||'-'}
function teamSummaryFromRiders(list){const s={complete:0,reject:0,cancel:0,riderFault:0,morning:0,afternoon:0,evening:0,midnight:0,excluded:0,count:list.length,onlineCount:onlineCount(list)};list.forEach(r=>{s.complete+=num(r.complete);s.reject+=num(r.reject);s.cancel+=num(r.cancel);s.riderFault+=num(r.riderFault);s.morning+=num(r.morning);s.afternoon+=num(r.afternoon);s.evening+=num(r.evening);s.midnight+=num(r.midnight);s.excluded+=excluded(r)});s.acceptRate=rate(s.complete,bad(s));s.spareRejects=spare(s.complete,bad(s));return s}
function teamSummary(t){return teamObj(t).summary||teamSummaryFromRiders(teamRiders(t))}
async function fetchJson(path){const r=await fetch(FIREBASE_BASE+path+'.json?v='+Date.now(),{cache:'no-store'});if(!r.ok)throw new Error(path);const j=await r.json();if(j==null)throw new Error(path+' empty');return j}
async function switchArea(key){
  const cfg=AREA_CONFIGS[key];if(!cfg)return;
  AREA_KEY=key;LIVE_PATH=cfg.livePath;WEEKLY_PATH=cfg.weeklyPath;
  TEAM_ORDER.splice(0,TEAM_ORDER.length,...cfg.teamOrder);
  WEEK_TEAM=TEAM_ORDER[0];MANAGE_FILTER='전체';DATA=null;WEEKLY=[];
  document.querySelectorAll('.area-tab').forEach(b=>b.classList.remove('active'));
  document.getElementById(key==='vic'?'areaBtnVic':'areaBtnDalseob')?.classList.add('active');
  const h=document.querySelector('.brand h1');if(h)h.textContent=cfg.title;
  await loadData();
}
async function loadData(){try{DATA=await fetchJson(LIVE_PATH);try{WEEKLY=await fetchJson(WEEKLY_PATH)}catch(e){WEEKLY=DATA.weekly||[]}normalizeTeams();document.getElementById('errorBox').innerHTML='';renderAll()}catch(e){const label=AREA_CONFIGS[AREA_KEY]?.label||AREA_KEY;document.getElementById('errorBox').innerHTML=`<div class="section" style="color:var(--red)">${label} 데이터를 읽지 못했습니다. Firebase 업로드 상태를 확인하세요.</div>`}}
function normalizeTeams(){
  const configured=[...(AREA_CONFIGS[AREA_KEY]?.teamOrder||[])];
  const incoming=Array.isArray(DATA?.teamOrder)?DATA.teamOrder:[];

  // 현재 선택한 권역에 등록된 팀만 표시합니다.
  // 다른 권역의 teamOrder가 Firebase 데이터에 남아 있어도 관제판에는 섞지 않습니다.
  const merged=configured.filter(t=>incoming.includes(t)||configured.includes(t));
  TEAM_ORDER.splice(0,TEAM_ORDER.length,...merged);

  if(!TEAM_ORDER.includes(WEEK_TEAM)){
    WEEK_TEAM=TEAM_ORDER[0]||'미분류';
  }
  if(MANAGE_FILTER!=='전체'&&!TEAM_ORDER.includes(MANAGE_FILTER)){
    MANAGE_FILTER='전체';
  }

  const f=document.getElementById('riderTeamFilter');
  if(f){
    const cur=f.value||'전체';
    f.innerHTML='<option value="전체">전체</option>'+
      TEAM_ORDER.map(t=>`<option value="${t}">${t}</option>`).join('');
    f.value=TEAM_ORDER.includes(cur)?cur:'전체';
  }
}
function buildWeekly(){
  const ws=DATA&&DATA.weeklySummary;
  if(ws&&Array.isArray(ws.days)){
    return{
      complete:num(ws.complete),
      bad:num(ws.badTotal),
      acceptRate:num(ws.acceptRate),
      spare:num(ws.spareRejects)
    };
  }
  const rows=Array.isArray(WEEKLY)?WEEKLY:[];
  const current=DATA?.businessDate||isoLocal(new Date());
  const start=weekStartWed(current),end=dateAdd(start,6);
  const currentRows=rows.filter(r=>r&&r.businessDate>=start&&r.businessDate<=end);
  let complete=0,b=0;
  currentRows.forEach(r=>{complete+=num(r.totalComplete);b+=bad(r)});
  return{complete,bad:b,acceptRate:rate(complete,b),spare:spare(complete,b)};
}

const SETTLEMENT_UNIT_BY_AREA={vic:350,dalseob_onna:250};
function settlementUnit(){return num(SETTLEMENT_UNIT_BY_AREA[AREA_KEY] ?? 350);}
const OVERTIME_UNIT=100;
function settlementTeams(){return TEAM_ORDER.filter(t=>t!=='미분류')}

function toggleSettlement(){
  const p=document.getElementById('settlementPanel'),b=document.getElementById('settlementBtn');
  const open=p.classList.toggle('hidden')===false;
  b.textContent=open?'닫기 ▴':'보기 ▾';
  if(open)renderSettlement();
}
function isoLocal(d){return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`}
function dateAdd(s,days){const [y,m,d]=String(s).split('-').map(Number),x=new Date(y,m-1,d);x.setDate(x.getDate()+days);return isoLocal(x)}
function weekStartWed(s){const [y,m,d]=String(s).split('-').map(Number),x=new Date(y,m-1,d);x.setDate(x.getDate()-((x.getDay()-3+7)%7));return isoLocal(x)}
function settlementWeeks(){
  const rows=Array.isArray(WEEKLY)?WEEKLY:[];
  const starts=[weekStartWed(isoLocal(new Date()))];
  rows.forEach(r=>{if(r?.businessDate)starts.push(weekStartWed(r.businessDate))});
  return [...new Set(starts)].sort().reverse().slice(0,8);
}
function settlementRows(start){const end=dateAdd(start,6);return (Array.isArray(WEEKLY)?WEEKLY:[]).filter(r=>r.businessDate>=start&&r.businessDate<=end)}
function slotBonus(done,goal,unit){
  done=Math.floor(num(done));goal=Math.floor(num(goal));unit=num(unit);
  if(goal<=0||done<=goal||unit<=0)return 0;
  const b=[goal,Math.floor(goal*1.10),Math.floor(goal*1.20),Math.floor(goal*1.30),Math.floor(goal*1.40),Math.floor(goal*1.50)];
  const rates=[.90,.80,.70,.60,.50];
  let remaining=Math.max(0,Math.min(done,b[5])-goal),total=0;
  for(let i=0;i<5;i++){const cap=Math.max(0,b[i+1]-b[i]),cnt=Math.min(remaining,cap);total+=cnt*unit*rates[i];remaining-=cnt;if(remaining<=0)break}
  return Math.round(total);
}
function calcSettlement(start,team){
  const rows=settlementRows(start),slots=[];let sets=0,excludedTotal=0,complete=0,badTotal=0;
  rows.forEach(r=>{
    const t=r?.teams?.[team],s=t?.summary||t||{},g=t?.targets||{};
    if(t){
      complete+=num(s.complete);badTotal+=bad(s);excludedTotal+=num(s.excluded);
      if(num(g.sets)>0)sets=num(g.sets);
    }
    PERIODS.forEach(([k])=>{const done=num(s[k]),goal=num(g[k]);if(goal>0)slots.push({done,goal,bonus:slotBonus(done,goal,settlementUnit())})});
  });
  if(!sets)sets=num(DATA?.teams?.[team]?.targets?.sets);
  const unit=settlementUnit(),fixed=680*sets,base=fixed*300,grade=fixed*unit;
  const excess=slots.reduce((s,x)=>s+x.bonus,0),overtime=excludedTotal*OVERTIME_UNIT;
  return {sets,complete,badTotal,excludedTotal,slots,achieved:slots.filter(x=>x.done>=x.goal).length,base,grade,excess,overtime,total:base+grade+excess+overtime};
}
function renderSettlement(){
  const weekEl=document.getElementById('settlementWeek'),teamEl=document.getElementById('settlementTeam'),box=document.getElementById('settlementBox');
  if(!weekEl||!teamEl||!box||!DATA)return;
  const weeks=settlementWeeks();
  const oldWeek=weekEl.value,oldTeam=teamEl.value;
  weekEl.innerHTML=weeks.map(w=>`<option value="${w}">${w} ~ ${dateAdd(w,6)}</option>`).join('');
  weekEl.value=weeks.includes(oldWeek)?oldWeek:weeks[0];
  const teams=settlementTeams();teamEl.innerHTML=teams.map(t=>`<option value="${t}">${t}</option>`).join('');
  teamEl.value=teams.includes(oldTeam)?oldTeam:teams[0];
  const c=calcSettlement(weekEl.value,teamEl.value);
  box.innerHTML=`<div class="settlement-headline"><span class="muted">${weekEl.value} ~ ${dateAdd(weekEl.value,6)} · ${teamEl.value}</span><strong>${n(c.total)}원</strong></div>
  <div class="settlement-kpis">
    <div class="settlement-kpi"><small>세트</small><b>${n(c.sets)}</b></div>
    <div class="settlement-kpi"><small>기록 슬롯</small><b>${c.slots.length}/28</b></div>
    <div class="settlement-kpi"><small>달성 슬롯</small><b>${c.achieved}/28</b></div>
    <div class="settlement-kpi"><small>시간외 건수</small><b>${n(c.excludedTotal)}</b></div>
  </div>
  <div class="settlement-money">
    <div class="settlement-row"><span>기본 관리비<br><small class="muted">680건 × ${n(c.sets)}세트 × 300원</small></span><b>${n(c.base)}원</b></div>
    <div class="settlement-row"><span>보너스 관리비<br><small class="muted">680건 × ${n(c.sets)}세트 × ${n(settlementUnit())}원</small></span><b>${n(c.grade)}원</b></div>
    <div class="settlement-row"><span>초과 관리비<br><small class="muted">슬롯별 100~150% 구간 요율</small></span><b>${n(c.excess)}원</b></div>
    <div class="settlement-row"><span>시간외 관리비<br><small class="muted">${n(c.excludedTotal)}건 × ${n(OVERTIME_UNIT)}원</small></span><b>${n(c.overtime)}원</b></div>
    <div class="settlement-row grand"><span>총 관리비</span><b>${n(c.total)}원</b></div>
  </div>
  <div class="settlement-note">미분류 기사는 정산에서 제외됩니다. 세트와 목표는 주간 JSON의 팀별 값을 우선 사용합니다.</div>`;
}

function renderSummary(){const total=DATA.total||{},week=buildWeekly();const cards=[['주간완료',week.complete,'red'],['당일완료',total.complete,'red'],['주간수락률',week.acceptRate+'%','blue'],['여유거절수',total.spareRejects,'green'],['전체접속인원',total.onlineCount+'명','green'],['현재시간대',currentPeriodLabel(),'blue'],...TEAM_ORDER.map(t=>[t+' 접속',num(teamSummary(t).onlineCount)+'명','green'])];document.getElementById('summaryGrid').innerHTML=cards.map(c=>`<div class="summary-card ${c[2]||''}"><div class="summary-title">${c[0]||'&nbsp;'}</div><div class="summary-value ${c[2]||''}">${c[1]}</div></div>`).join('')}
function toggleWeekly(){const p=document.getElementById('weeklyPanel'),b=document.getElementById('weeklyBtn');const open=p.classList.toggle('hidden')===false;b.textContent=open?'닫기 ▴':'보기 ▾'}
function toggleManage(){const p=document.getElementById('managePanel'),b=document.getElementById('manageBtn');const open=p.classList.toggle('hidden')===false;b.textContent=open?'닫기 ▴':'보기 ▾'}
function dayBase(){return DATA?.weeklySummary?.days?.length?DATA.weeklySummary.days:[]}
function periodStatusFinal(key,done,goal){const order=['morning','afternoon','evening','midnight'];const cur=DATA?.currentPeriod||'morning';const passed=order.indexOf(key)<order.indexOf(cur);if(passed){return num(done)>=num(goal)?'<span class="badge ok">성공</span>':'<span class="badge fail">실패</span>'}return '<span class="badge wait">진행중</span>'}
function teamDaySummary(d,team){const ts=d.teams?.[team];if(ts?.summary)return {summary:ts.summary,targets:ts.targets||d.periodTargets||{}};return {summary:{morning:0,afternoon:0,evening:0,midnight:0,complete:0,reject:0,cancel:0,riderFault:0,excluded:0,acceptRate:100},targets:d.periodTargets||{}}}
function setWeeklyTeam(team){WEEK_TEAM=team;renderWeekly()}
function weeklyTeamRow(d,team){const x=teamDaySummary(d,team),s=x.summary,t=x.targets;const ps=PERIODS.map(([k])=>({key:k,done:num(s[k]),goal:num(t[k])}));const failKeys=ps.filter(p=>num(p.goal)>0&&num(p.done)<num(p.goal));const result=failKeys.length?`<span class="failtxt">실패 ${failKeys.map(p=>PERIOD_LABEL[p.key]).join(', ')}</span>`:`<span class="oktxt">성공</span>`;return `<tr><td>${d.label||''}<br><span class="muted" style="font-size:12px">${d.businessDate||''}</span></td>${ps.map(p=>`<td class="${p.goal>0&&p.done<p.goal?'failtxt':''}">${n(p.done)} / ${n(p.goal)}</td>`).join('')}<td>${n(s.excluded)}</td><td>${result}</td><td>${s.acceptRate??rate(s.complete,bad(s))}%</td></tr>`}
function renderWeekly(){const days=dayBase();document.getElementById('weekRange').textContent=DATA?.weeklySummary?`${DATA.weeklySummary.startDate||''} ~ ${DATA.weeklySummary.endDate||''}`:'';const tabs=document.getElementById('weeklyTeamTabs');if(tabs){tabs.innerHTML=TEAM_ORDER.map(t=>`<button class="week-tab ${WEEK_TEAM===t?'active':''}" onclick="setWeeklyTeam('${t}')">${t}</button>`).join('')}if(!days.length){document.getElementById('weeklyTable').innerHTML='<tbody><tr><td>주간 데이터가 아직 없습니다.</td></tr></tbody>';return}document.getElementById('weeklyTable').innerHTML=`<thead><tr><th>${WEEK_TEAM} / 일자</th><th>오전<br>완료/발주</th><th>오후<br>완료/발주</th><th>저녁<br>완료/발주</th><th>심야<br>완료/발주</th><th>미포함</th><th>결과</th><th>수락률</th></tr></thead><tbody>${days.map(d=>weeklyTeamRow(d,WEEK_TEAM)).join('')}</tbody>`}
function renderPeriods(){document.getElementById('periodGrid').innerHTML=PERIODS.map(([k])=>{const done=TEAM_ORDER.reduce((sum,t)=>sum+num(teamObj(t).summary?.[k]),0);const goal=TEAM_ORDER.reduce((sum,t)=>sum+num(teamObj(t).targets?.[k]),0);return `<div class="period-card"><div class="period-name">${PERIOD_LABEL[k]}</div><div class="period-main"><span>${n(done)}</span> / ${n(goal)}</div><div class="mini">전체 물량 · 완료 / 발주량</div><div class="progress"><div class="fill" style="width:${pct(done,goal)}%"></div></div><div class="period-result">${periodStatusFinal(k,done,goal)}</div></div>`}).join('')}
function teamRow(name,list,summary,targets){const badTotal=bad(summary),acc=summary.acceptRate??rate(summary.complete,badTotal);return `<tr><td>${name}<br><span class="muted" style="font-size:12px">${list.length}명 / 접속 ${onlineCount(list)}명</span></td>${PERIODS.map(([k])=>`<td>${n(summary[k])} / ${n(targets[k])}</td>`).join('')}<td>${acc}%</td><td>${n(summary.spareRejects??spare(summary.complete,badTotal))}</td><td>${n(summary.excluded)}</td></tr>`}
function renderTeams(){document.getElementById('teamTable').innerHTML=`<thead><tr><th>팀명 라이더(접속중)</th><th>오전<br>(완료/발주량)</th><th>오후<br>(완료/발주량)</th><th>저녁<br>(완료/발주량)</th><th>심야<br>(완료/발주량)</th><th>수락률</th><th>여유거절</th><th>미포함</th></tr></thead><tbody>${TEAM_ORDER.map(t=>teamRow(t,teamRiders(t),teamSummary(t),teamObj(t).targets||{})).join('')}</tbody>`}
function filteredRiders(){let q=document.getElementById('riderSearch')?.value?.trim()||'';let teamFilter=document.getElementById('riderTeamFilter')?.value||'전체';let list=[...riders()];if(teamFilter!=='전체'){list=list.filter(r=>r.team===teamFilter)}if(q)list=list.filter(r=>String(r.name||'').includes(q));let s=document.getElementById('riderSort')?.value||'complete';list.sort((a,b)=>{if(a.isOnline!==b.isOnline)return b.isOnline-a.isOnline;if(s==='name')return String(a.name).localeCompare(String(b.name),'ko');if(s==='reject')return bad(b)-bad(a);return num(b.complete)-num(a.complete)});return list}
function renderRiders(){document.getElementById('riderGrid').innerHTML=filteredRiders().map(r=>`<div class="rider ${r.isOnline?'online':''}"><div class="rider-top"><div class="rider-name">${r.name} <span class="muted" style="font-size:12px">${r.team||''}</span></div><span class="status">${r.isOnline?'접속중':'운행종료'}</span></div><div class="rider-stats"><div class="rstat"><small>완료</small><b>${n(r.complete)}</b></div><div class="rstat"><small>거절</small><b>${n(r.reject)}</b></div><div class="rstat"><small>취소</small><b>${n(r.cancel)}</b></div><div class="rstat"><small>수락률</small><b>${r.acceptRate}%</b></div></div></div>`).join('')||'<div class="muted">검색 결과가 없습니다.</div>'}
function setManageFilter(team){MANAGE_FILTER=team;renderManage()}
function renderManage(){const filters=document.getElementById('manageFilters');if(filters){filters.innerHTML=['전체',...TEAM_ORDER].map(t=>`<button class="${MANAGE_FILTER===t?'active':''}" onclick="setManageFilter('${t}')">${t}</button>`).join('')}let list=[...riders()];if(MANAGE_FILTER!=='전체')list=list.filter(r=>r.team===MANAGE_FILTER);list.sort((a,b)=>String(a.name).localeCompare(String(b.name),'ko'));document.getElementById('manageList').innerHTML=list.map(r=>`<div class="manage-row"><b>${r.name}<span class="muted" style="font-size:12px"> · ${r.userId||''}</span></b><select data-rider-name="${String(r.name||'').replace(/"/g,'&quot;')}">${TEAM_ORDER.map(t=>`<option value="${t}" ${r.team===t?'selected':''}>${t}</option>`).join('')}</select></div>`).join('')||'<div class="muted">기사 데이터가 없습니다.</div>'}
const TEAMMAP_API='https://dalseo-a-live.vercel.app/api/save-teammap';

async function saveTeamMap(){
  const selects=document.querySelectorAll('#manageList select');
  const changes={};
  selects.forEach(sel=>{
    const name=sel.getAttribute('data-rider-name');
    if(name&&sel.value)changes[name]=sel.value;
  });

  if(!Object.keys(changes).length){
    alert('저장할 기사 정보가 없습니다.');
    return;
  }

  const saveButton=document.querySelector('.manage-save');
  const originalText=saveButton?.textContent||'팀 변경 저장';

  try{
    if(saveButton){
      saveButton.disabled=true;
      saveButton.textContent='저장 중...';
    }

    const res=await fetch(TEAMMAP_API,{
      method:'POST',
      mode:'cors',
      headers:{
        'Content-Type':'application/json',
        'Accept':'application/json'
      },
      body:JSON.stringify({
        area:AREA_KEY,
        changes
      })
    });

    const responseText=await res.text();
    let result={};
    try{
      result=responseText?JSON.parse(responseText):{};
    }catch(e){
      result={error:responseText||'서버 응답을 해석하지 못했습니다.'};
    }

    if(!res.ok||result.ok===false){
      throw new Error(result.error||`HTTP ${res.status}`);
    }

    riders().forEach(r=>{
      if(changes[r.name])r.team=changes[r.name];
    });

    alert(`팀 변경 저장 완료 (${Object.keys(changes).length}명)`);
    renderAll();
    setTimeout(loadData,1500);
  }catch(e){
    alert(
      '저장 오류: '+e.message+
      '\nVercel API 연결과 CORS 설정을 확인해주세요.'+
      '\n요청 주소: '+TEAMMAP_API
    );
  }finally{
    if(saveButton){
      saveButton.disabled=false;
      saveButton.textContent=originalText;
    }
  }
}
function smsGroupHtml(teamName,list){let html=`<div class="sms-team"><h3 style="margin:0 0 10px">${teamName} (${list.length}명)</h3>`;for(let i=0;i<list.length;i+=99){const g=list.slice(i,i+99),label=String.fromCharCode(65+i/99),phones=g.map(x=>x.phone).join(',');html+=`<div class="sms-group"><b>${label}그룹 (${g.length}명)</b><div class="phone-list">${g.map(x=>`${x.name} ${x.phone}`).join(' · ')}</div><div class="sms-actions"><button onclick="copyText('${phones}')">번호 복사</button><a href="sms:${phones}">문자앱 열기</a></div></div>`}return html+'</div>'}

function closeSmsModal(){document.getElementById('smsModal').classList.remove('show')}function copyText(t){navigator.clipboard?.writeText(t);alert('복사했습니다.')}
