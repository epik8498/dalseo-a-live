var(--green);font-weight:1000}.failtxt{color:var(--red);font-weight:1000}.badge{display:inline-flex;align-items:center;justify-content:center;border-radius:999px;padding:6px 10px;font-size:12px;font-weight:1000}.badge.ok{background:#e8fff3;color:#047a43}.badge.fail{background:#fff0f0;color:#d92d20}.badge.wait{background:#eef2f6;color:#475467}.period-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}.period-card{border:1px solid var(--line);border-radius:20px;background:linear-gradient(180deg,#fff,#fbfcfe);padding:16px}.period-name{font-size:17px}.period-main{font-size:26px;margin:14px 0 6px;letter-spacing:-.5px}.period-main span:first-child{color:var(--red)}.mini{font-size:12px;color:var(--muted)}.progress{height:12px;background:#eef2f6;border-radius:999px;overflow:hidden;margin:12px 0}.fill{height:100%;background:linear-gradient(90deg,var(--red),#ff7988);border-radius:999px}.period-result{border-top:1px solid var(--line);margin-top:13px;padding-top:12px;font-size:14px}.rider-tools{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px}.rider-tools input,.rider-tools select{border:1px solid var(--line);background:#fff;border-radius:14px;padding:13px 14px;font-weight:900}.rider-tools input{flex:1;min-width:180px}.rider-tools button{border:0;background:var(--red);color:#fff;border-radius:14px;padding:13px 16px;font-weight:1000;cursor:pointer}.rider-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}.rider{border:1px solid var(--line);border-radius:18px;background:#fff;padding:14px}.rider.online{border-color:rgba(18,183,106,.55);background:#f0fff7}.rider-top{display:flex;justify-content:space-between;gap:10px;align-items:center}.rider-name{font-size:19px}.status{font-size:12px;border-radius:999px;padding:6px 9px;background:#eef2f6;color:#475467}.online .status{background:#dcfae6;color:#067647}.rider-stats{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin-top:12px}.rstat{border-radius:12px;background:var(--soft);padding:10px 6px;te :8px 0 14px}
@media(max-width:760px){.wrap{padding:10px 10px 60px}.hero-inner{align-items:flex-start}.brand h1{font-size:20px}.pill{display:none}.summary-grid{grid-template-columns:repeat(3,1fr);gap:7px}.summary-card{min-height:88px;padding:13px 8px;border-radius:16px}.summary-title{font-size:11.5px}.summary-value{font-size:20px;margin-top:10px}.section{padding:16px;border-radius:20px}.period-grid{grid-template-columns:1fr 1fr}.rider-grid{grid-template-columns:1fr}.rider-tools input,.rider-tools select,.rider-tools button{width:100%}}

.settlement-controls{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:14px}
.settlement-controls select{flex:1;min-width:180px;border:1px solid var(--line);background:#fff;border-radius:14px;padding:12px 13px;font-weight:1000}
.settlement-box{border:1px solid var(--line);border-radius:20px;background:linear-gradient(180deg,#fff,#fbfcfe);padding:18px}
.settlement-headline{text-align:center;margin-bottom:14px}
.settlement-headline strong{display:block;font-size:27px;color:var(--red);margin-top:6px}
.settlement-kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin:14px 0}

/* 모바일 상단 권역 버튼 찌그러짐 방지 */

  .hero{padding:10px 0 10px}
  .hero-inner{
    display:grid;
    grid-template-columns:1fr;
    gap:10px;
    align-items:stretch;
  }
  .brand{
    min-width:0;
    width:100%;
  }
  .brand>div:last-child{
    min-width:0;
  }
  .brand h1{
    font-size:18px;
    line-height:1.25;

  }

    text-overflow:ellipsis;
  }
  .logo{
    width:42px;
    height:42px;
    min-width:42px;
    border-radius:14px;
    font-size:20px;
  }
  .region-tabs{
    width:100%;
    display:grid;
    grid-template-columns:repeat(2,minmax(0,1fr));
    gap:6px;
    padding:4px;
    border-radius:14px;
  }
  .area-tab{
    width:100%;
    min-width:0;
    padding:11px 6px;
    font-size:14px;
    line-height:1;
    white-space:nowrap;
    word-break:keep-all;

  }
  .section-head{

    gap:8px;
  }

    min-width:0;

  }

    font-size:13px;
    white-space:nowrap;
  }
}


/* ===== VIC UI 개선 + 주간기록 상태 ===== */
:root{
  --ss-bg:#f4f6f8;--ss-surface:#fff;--ss-surface2:#f8fafc;--ss-text:#111827;
  --ss-sub:#6b7280;--ss-border:#e5e7eb;--ss-red:#e60012;

.wrap{max-width:1080px!important;padding:14px 14px 65px!important}
.hero{position:relative!important;top:auto!important;background:rgba(255,255,255,.9)!important;border:1px solid var(--ss-border)!important;border-radius:22px!important;padding:14px!important;box-shadow:var(--ss-shadow)!important;margin-bottom:12px!important}
.summary-grid{gap:8px!important}.summary-card{border:1px solid var(--ss-border)!important;border-radius:17px!important;box-shadow:var(--ss-shadow-sm)!important;min-height:92px!important;padding:13px 11px!important}.summary-card:before{display:none!important}.summary-title{font-size:11px!important}.summary-value{font-size:23px!important;margin-top:8px!important}
.section{border:1px solid var(--ss-border)!important;border-radius:18px!important;box-shadow:var(--ss-shadow-sm)!important;padding:16px!important;margin:12px 0!important}
.period-grid{gap:8px!important}.period-card{border-color:var(--ss-border)!important;border-radius:16px!important;padding:13px!important}.progress{height:7px!important}
.rider-grid{grid-template-columns:repeat(3,minmax(0,1fr))!important;gap:8px!important}.rider{border-color:var(--ss-border)!important;border-radius:16px!important;padding:13px!important;box-shadow:var(--ss-shadow-sm)!important}.rider-name{font-size:17px!important}.rstat{padding:8px 4px!important}.rstat small{font-size:10px!important}.rstat b{font-size:14px!important}

/* ===== INDEX 스타일 VIC UI ===== */
:root{
  --ss-bg:#f4f6f8;--ss-surface:#fff;--ss-surface2:#f8fafc;--ss-text:#111827;
  --ss-sub:#6b7280;--ss-border:#e5e7eb;--ss-red:#e60012;--ss-red-soft:#fff1f2;
  --ss-shadow:0 8px 28px rgba(17,24,39,.07);--ss-shadow-sm:0 3px 14px rgba(17,24,39,.055)
}
body{background:radial-gradient(circle at 50% -120px,rgba(230,0,18,.07),transparent 380px),var(--ss-bg)!important;color:var(--ss-text)!important}
body.dark{--ss-bg:#080b10;--ss-surface:#11151c;--ss-surface2:#171c24;--ss-text:#f9fafb;--ss-sub:#9ca3af;--ss-border:#252c36;background:radial-gradient(circle at 50% -120px,rgba(230,0,18,.12),transparent 380px),var(--ss-bg)!important}

.area{margin:13px 0 5px!important;font-size:18px!important}.area b{display:inline-block;background:var(--ss-red-soft);color:var(--ss-red);border-radius:999px;padding:5px 10px}

.summary{border:0!important;background:transparent!important;overflow:visible!important;margin:0 0 18px!important}

.ops-head{display:flex;justify-content:space-between;gap:8px;align-items:center}.ops-title{font-size:17px;font-weight:1000}.ops-state{font-size:10px;color:var(--ss-sub)}

<body>
<div class="wrap">
  <div class="top">
    <div class="top-actions">
      <div class="area-switch">
        <button id="areaBtnVic" class="move active-area" onclick="switchArea('vic')">중구A</button>
        <button id="areaBtnDalseob" class="move" onclick="switchArea('dalseob_onna')">달서B</button>

<!-- renderTeams 호환용: 화면에서는 사용하지 않음 -->
<table id="teamTable" style="display:none"></table>

<div class="modal" id="smsModal">
  <div class="modal-card">
    <div class="modal-head">
      <div><h2 style="margin:0">단체문자 그룹</h2><p class="muted" style="margin:6px 0 0">팀별 최대 99명씩 나눕니다.</p></div>
      <button class="close" onclick="closeSmsModal()">닫기</button>
    </div>
    <div id="smsGroups"></div>
  </div>
</div>
<script>
const FIREBASE_BASE='https://supersonic-l-default-rtdb.asia-southeast1.firebasedatabase.app';
const AREA_CONFIGS={
  vic:{label:'중구A',title:'VIC 성공드림 · 중구A 관제판',livePath:'/live/vic',weeklyPath:'/weekly/vic',teamOrder:['성공','상생','BM','서구','룰랄','미분류']},
  dalseob_onna:{label:'달서B',title:'VIC 성공드림 · 달서B 관제판',livePath:'/live/dalseob_onna',weeklyPath:'/weekly/dalseob_onna',teamOrder:['슈','넘','마','미분류']}
};
let AREA_KEY='vic';
let LIVE_PATH=AREA_CONFIGS.vic.livePath;
let WEEKLY_PATH=AREA_CONFIGS.vic.weeklyPath;
const TEAM_ORDER=[...AREA_CONFIGS.vic.teamOrder];
let WEEK_TEAM='성공';
let MANAGE_FILTER='전체';
const PERIODS=[['morning','오전'],['afternoon','오후'],['evening','저녁'],['midnight','심야']];
const PERIOD_LABEL={morning:'오전피크',afternoon:'오후논피크',evening:'저녁피크',midnight:'심야논피크'};
let DATA=null,WEEKLY=[];

function toggleMode(){
  document.body.classList.toggle('dark');
  const dark=document.body.classList.contains('dark');
  localStorage.setItem('vicMode',dark?'dark':'light');
  const b=document.getElementById('modeBtn');
  if(b)b.textContent=dark?'☀ 라이트 모드':'🌙 다크 모드';
}
if(localStorage.getItem('vicMode')==='dark')document.body.classList.add('dark');

function switchPage(page,btn){
  window.__USER_SELECTED_PAGE=page;
  document.querySelectorAll('.page-view').forEach(x=>x.classList.remove('active'));
  document.querySelectorAll('.side-nav-btn').forEach(x=>x.classList.remove('active'));
  document.getElementById('page-'+page)?.classList.add('active');
  if(btn)btn.classList.add('active');
  else document.querySelector(`.side-nav-btn[data-page="${page}"]`)?.classList.add('active');
  if(page==='weekly')renderWeekly();
  if(page==='settlement')renderSettlement();
  if(page==='manage'&&typeof renderManage==='function')renderManage();
}

function num(v){return Number(v||0)}function n(v){return num(v).toLocaleString('ko-KR')}function rate(c,b){c=num(c);b=num(b);return c+b?Math.round((c/(c+b))*1000)/10:100}function spare(c,b){return Math.floor(num(c)*.25)-num(b)}function bad(r){return num(r.reject||r.totalReject)+num(r.cancel||r.totalCancel)+num(r.riderFault)}function pct(a,b){return !num(b)?0:Math.min(100,Math.round(num(a)/num(b)*100))}function riders(){return uniqueRidersForDisplay(DATA?.riders||[])}function teamObj(t){return DATA?.teams?.[t]||{summary:{},targets:{},riders:[]}}function teamRiders(t){return riders().filter(r=>r.team===t)}function onlineCount(list){return list.filter(r=>r.isOnline).length}function excluded(r){return num(r.excluded||0)}function currentPeriodLabel(){return DATA?.currentPeriodLabel||PERIOD_LABEL[DATA?.currentPeriod]||'-'}
function teamSummaryFromRiders(list){const s={complete:0,reject:0,cancel:0,riderFault:0,morning:0,afternoon:0,evening:0,midnight:0,excluded:0,count:list.length,onlineCount:onlineCount(list)};list.forEach(r=>{s.complete+=num(r.complete);s.reject+=num(r.reject);s.cancel+=num(r.cancel);s.riderFault+=num(r.riderFault);s.morning+=num(r.morning);s.afternoon+=num(r.afternoon);s.evening+=num(r.evening);s.midnight+=num(r.midnight);s.excluded+=excluded(r)});s.acceptRate=rate(s.complete,bad(s));s.spareRejects=spare(s.complete,bad(s));return s}
function teamSummary(t){return teamObj(t).summary||teamSummaryFromRiders(teamRiders(t))}
async function fetchJson(path){const r=await fetch(FIREBASE_BASE+path+'.json?v='+Date.now(),{cache:'no-store'});if(!r.ok)throw new Error(path);const j=await r.json();if(j==null)throw new Error(path+' empty');return j}
async function switchArea(key){
  const cfg=AREA_CONFIGS[key];if(!cfg)return;
  AREA_KEY=key;LIVE_PATH=cfg.livePath;WEEKLY_PATH=cfg.weeklyPath;
  TEAM_ORDER.splice(0,TEAM_ORDER.length,...cfg.teamOrder);
  WEEK_TEAM=TEAM_ORDER[0];MANAGE_FILTER='전체';DATA=null;WEEKLY=[];
  document.querySelectorAll('#areaBtnVic,#areaBtnDalseob').forEach(b=>b.classList.remove('active-area'));
  document.getElementById(key==='vic'?'areaBtnVic':'areaBtnDalseob')?.classList.add('active-area');
  const areaText=document.getElementById('areaText');if(areaText)areaText.textContent=cfg.label;
  await loadData();
  switchPage('overview');
}
async function loadData(){
  try{
    DATA=await fetchJson(LIVE_PATH);
  }catch(e){
    console.error('실시간 데이터 로딩 오류',e);
    const label=AREA_CONFIGS[AREA_KEY]?.label||AREA_KEY;
    document.getElementById('errorBox').innerHTML=
      `<div class="error">${label} 실시간 데이터를 읽지 못했습니다. Firebase ${LIVE_PATH} 경로를 확인하세요.</div>`;
    return;
  }

  try{
    WEEKLY=await fetchJson(WEEKLY_PATH);
  }catch(e){
    console.warn('주간 데이터 로딩 오류',e);
    WEEKLY=DATA.weekly||[];
  }

  try{
    normalizeTeams();
    document.getElementById('errorBox').innerHTML='';
    renderAll();
  }catch(e){
    console.error('화면 렌더링 오류',e);
    document.getElementById('errorBox').innerHTML=
      `<div class="error">데이터는 정상 수신됐지만 화면 표시 중 오류가 발생했습니다: ${e.message||e}</div>`;
  }
}
function normalizeTeams(){
  const configured=[...(AREA_CONFIGS[AREA_KEY]?.teamOrder||[])];
  const incoming=Array.isArray(DATA?.teamOrder)?DATA.teamOrder:[];

  // 현재 선택한 권역에 등록된 팀만 표시합니다.
  // 다른 권역의 teamOrder가 Firebase 데이터에 남아 있어도 관제판에는 섞지 않습니다.
  const merged=configured.filter(t=>incoming.includes(t)||configured.includes(t));
  TEAM_ORDER.splice(0,TEAM_ORDER.length,...merged);

  if(!TEAM_ORDER.includes(WEEK_TEAM)){
    WEEK_TEAM=TEAM_ORDER[0]||'미분류';
  }
  if(MANAGE_FILTER!=='전체'&&!TEAM_ORDER.includes(MANAGE_FILTER)){
    MANAGE_FILTER='전체';
  }

  const f=document.getElementById('riderTeamFilter');
  if(f){
    const cur=f.value||'전체';
    f.innerHTML='<option value="전체">전체</option>'+
      TEAM_ORDER.map(t=>`<option value="${t}">${t}</option>`).join('');
    f.value=TEAM_ORDER.includes(cur)?cur:'전체';
  }
}
function buildWeekly(){
  const ws=DATA&&DATA.weeklySummary;
  if(ws&&Array.isArray(ws.days)){
    return{
      complete:num(ws.complete),
      bad:num(ws.badTotal),
      acceptRate:num(ws.acceptRate),
      spare:num(ws.spareRejects)
    };
  }
  const rows=Array.isArray(WEEKLY)?WEEKLY:[];
  const current=DATA?.businessDate||isoLocal(new Date());
  const start=weekStartWed(current),end=dateAdd(start,6);
  const currentRows=rows.filter(r=>r&&r.businessDate>=start&&r.businessDate<=end);
  let complete=0,b=0;
  currentRows.forEach(r=>{complete+=num(r.totalComplete);b+=bad(r)});
  return{complete,bad:b,acceptRate:rate(complete,b),spare:spare(complete,b)};
}

const SETTLEMENT_UNIT_BY_AREA={vic:350,dalseob_onna:250};
function settlementUnit(){return num(SETTLEMENT_UNIT_BY_AREA[AREA_KEY] ?? 350);}
const OVERTIME_UNIT=100;
function settlementTeams(){return TEAM_ORDER.filter(t=>t!=='미분류')}

function toggleSettlement(){
  const p=document.getElementById('settlementPanel'),b=document.getElementById('settlementBtn');
  const open=p.classList.toggle('hidden')===false;
  b.textContent=open?'닫기 ▴':'보기 ▾';
  if(open)renderSettlement();
}
function isoLocal(d){return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`}
function dateAdd(s,days){const [y,m,d]=String(s).split('-').map(Number),x=new Date(y,m-1,d);x.setDate(x.getDate()+days);return isoLocal(x)}
function weekStartWed(s){const [y,m,d]=String(s).split('-').map(Number),x=new Date(y,m-1,d);x.setDate(x.getDate()-((x.getDay()-3+7)%7));return isoLocal(x)}
function settlementWeeks(){
  const rows=Array.isArray(WEEKLY)?WEEKLY:[];
  const starts=[weekStartWed(isoLocal(new Date()))];
  rows.forEach(r=>{if(r?.businessDate)starts.push(weekStartWed(r.businessDate))});
  return [...new Set(starts)].sort().reverse().slice(0,8);
}
function settlementRows(start){const end=dateAdd(start,6);return (Array.isArray(WEEKLY)?WEEKLY:[]).filter(r=>r.businessDate>=start&&r.businessDate<=end)}
function slotBonus(done,goal,unit){
  done=Math.floor(num(done));goal=Math.floor(num(goal));unit=num(unit);
  if(goal<=0||done<=goal||unit<=0)return 0;
  const b=[goal,Math.floor(goal*1.10),Math.floor(goal*1.20),Math.floor(goal*1.30),Math.floor(goal*1.40),Math.floor(goal*1.50)];
  const rates=[.90,.80,.70,.60,.50];
  let remaining=Math.max(0,Math.min(done,b[5])-goal),total=0;
  for(let i=0;i<5;i++){const cap=Math.max(0,b[i+1]-b[i]),cnt=Math.min(remaining,cap);total+=cnt*unit*rates[i];remaining-=cnt;if(remaining<=0)break}
  return Math.round(total);
}
function calcSettlement(start,team){
  const rows=settlementRows(start),slots=[];let sets=0,excludedTotal=0,complete=0,badTotal=0;
  rows.forEach(r=>{
    const t=r?.teams?.[team],s=t?.summary||t||{},g=t?.targets||{};
    if(t){
      complete+=num(s.complete);badTotal+=bad(s);excludedTotal+=num(s.excluded);
      if(num(g.sets)>0)sets=num(g.sets);
    }
    PERIODS.forEach(([k])=>{const done=num(s[k]),goal=num(g[k]);if(goal>0)slots.push({done,goal,bonus:slotBonus(done,goal,settlementUnit())})});
  });
  if(!sets)sets=num(DATA?.teams?.[team]?.targets?.sets);
  const unit=settlementUnit(),fixed=680*sets,base=fixed*300,grade=fixed*unit;
  const excess=slots.reduce((s,x)=>s+x.bonus,0),overtime=excludedTotal*OVERTIME_UNIT;

function weeklyTeamDays(team){

  // fallback: Firebase /weekly/vic 원본에서 현재 수~화 주차의 팀 데이터를 직접 구성
  const current=DATA?.businessDate||isoLocal(new Date());
  const start=weekStartWed(current),end=dateAdd(start,6);
  const byDate=new Map(
    (Array.isArray(WEEKLY)?WEEKLY:[])
      .filter(r=>r&&r.businessDate>=start&&r.businessDate<=end)
      .map(r=>[r.businessDate,r])
  );

  const labels=['수','목','금','토','일','월','화'];
  return labels.map((label,i)=>{

    return {
      label,
      businessDate:date,
      hasData:Boolean(byDate.get(date)),
      complete:num(s.complete),
      reject:num(s.reject),
      cancel:num(s.cancel),
      riderFault:num(s.riderFault),

      afternoon:num(s.afternoon),
      evening:num(s.evening),
      midnight:num(s.midnight),
      excluded:num(s.excluded),
      targets:{
        morning:num(g.morning),
        afternoon:num(g.afternoon),
        evening:num(g.evening),
        midnight:num(g.midnight)
      },
      acceptRate:s.acceptRate!=null?num(s.acceptRate):rate(num(s.complete),bad(s))
    };
  });
}

function normalizeRiderPhone(v){return String(v||'').replace(/\D/g,'')}
function uniqueRidersForDisplay(list){
  const out=[];
  const keyIndex=new Map();

  (Array.isArray(list)?list:[]).forEach(r=>{
    const phone=normalizeRiderPhone(r?.phone);
    const uid=String(r?.userId||'').trim();
    // 이름만 같은 경우는 동명이인이므로 합치지 않습니다.
    const keys=[];
    if(phone)keys.push('p:'+phone);
    if(uid)keys.push('u:'+uid);

    let idx=-1;
    for(const k of keys){
      if(keyIndex.has(k)){idx=keyIndex.get(k);break;}
    }

    if(idx<0){
      idx=out.length;
      out.push(r);
    }else{
      const old=out[idx]||{};
      const oldScore=(old.placeholder?0:1000000)+(old.isOnline?100000:0)+num(old.complete);
      const newScore=(r?.placeholder?0:1000000)+(r?.isOnline?100000:0)+num(r?.complete);
      if(newScore>oldScore)out[idx]=r;
    }

    const chosen=out[idx]||r;
    const cp=normalizeRiderPhone(chosen?.phone);
    const cu=String(chosen?.userId||'').trim();
    if(cp)keyIndex.set('p:'+cp,idx);
    if(cu)keyIndex.set('u:'+cu,idx);
    keys.forEach(k=>keyIndex.set(k,idx));
  });
  return out;
}

const TEAMMAP_API='https://dalseo-a-live.vercel.app/api/save-teammap';

async function saveTeamMap(){
  const selects=document.querySelectorAll('#manageList select');
  const changes={};
  selects.forEach(sel=>{
    const name=sel.getAttribute('data-rider-name');
    if(name&&sel.value)changes[name]=sel.value;
  });

  if(!Object.keys(changes).length){
    alert('저장할 기사 정보가 없습니다.');
    return;
  }

  const saveButton=document.querySelector('.manage-save');
  const originalText=saveButton?.textContent||'팀 변경 저장';

  try{
    if(saveButton){
      saveButton.disabled=true;
      saveButton.textContent='저장 중...';
    }

    const res=await fetch(TEAMMAP_API,{
      method:'POST',
      mode:'cors',
      headers:{
        'Content-Type':'application/json',
        'Accept':'application/json'
      },
      body:JSON.stringify({
        area:AREA_KEY,
        changes
      })
    });

    const responseText=await res.text();
    let result={};
    try{
      result=responseText?JSON.parse(responseText):{};
    }catch(e){
      result={error:responseText||'서버 응답을 해석하지 못했습니다.'};
    }

    if(!res.ok||result.ok===false){
      throw new Error(result.error||`HTTP ${res.status}`);
    }

    riders().forEach(r=>{
      if(changes[r.name])r.team=changes[r.name];
    });

    alert(`팀 변경 저장 완료 (${Object.keys(changes).length}명)`);
    renderAll();
    setTimeout(loadData,1500);
  }catch(e){
    alert(
      '저장 오류: '+e.message+
      '\nVercel API 연결과 CORS 설정을 확인해주세요.'+
      '\n요청 주소: '+TEAMMAP_API
    );
  }finally{
    if(saveButton){
      saveButton.disabled=false;
      saveButton.textContent=originalText;
    }
  }
}

function smsGroupHtml(teamName,list){let html=`<div class="sms-team"><h3 style="margin:0 0 10px">${teamName} (${list.length}명)</h3>`;for(let i=0;i<list.length;i+=99){const g=list.slice(i,i+99),label=String.fromCharCode(65+i/99),phones=g.map(x=>x.phone).join(',');html+=`<div class="sms-group"><b>${label}그룹 (${g.length}명)</b><div class="phone-list">${g.map(x=>`${x.name} ${x.phone}`).join(' · ')}</div><div class="sms-actions"><button onclick="copyText('${phones}')">번호 복사</button><a href="sms:${phones}">문자앱 열기</a></div></div>`}return html+'</div>'}
function openSmsModal(){const base=filteredRiders().filter(r=>r.phone).map(r=>({team:r.team,name:r.name,phone:String(r.phone).replace(/\D/g,'')}));let html=TEAM_ORDER.map(t=>smsGroupHtml(t,base.filter(x=>x.team===t))).join('');document.getElementById('smsGroups').innerHTML=html;document.getElementById('smsModal').classList.add('show')}
function closeSmsModal(){document.getElementById('smsModal').classList.remove('show')}function copyText(t){navigator.clipboard?.writeText(t);alert('복사했습니다.')}
function openUnclassifiedManage(){
  MANAGE_FILTER='미분류';
  switchPage('manage');
  renderManage();
}
function renderAll(){
  document.getElementById('topUpdate').textContent='마지막 업데이트: '+(DATA.updatedAt||'-');
  const unclassified=(DATA?.riders||[]).filter(r=>r.team==='미분류');
  document.getElementById('errorBox').innerHTML='';
  const alertBox=document.getElementById('newRiderAlert');
  if(alertBox){
    alertBox.innerHTML=unclassified.length?`<button class="new-rider-alert" onclick="openUnclassifiedManage()">
      <span class="new-rider-alert-icon">!</span>
      <span class="new-rider-alert-text"><b>신규 기사 ${unclassified.length}명 확인 필요</b><small>${unclassified.slice(0,5).map(r=>r.name).join(', ')}${unclassified.length>5?' 외 '+(unclassified.length-5)+'명':''}</small></span>
      <span class="new-rider-alert-action">기사관리 →</span>
    </button>`:'';
  }
  if(typeof renderWeeklySaveStatus==='function')renderWeeklySaveStatus();
  renderSummary();renderWeekly();renderSettlement();renderPeriods();renderTeams();renderManage();renderRiders();
  const b=document.getElementById('modeBtn');if(b)b.textContent=document.body.classList.contains('dark')?'☀ 라이트 모드':'🌙 다크 모드';
}

async function refreshDashboardDataOnly(){
  // 중요: 이 함수는 데이터만 새로 읽습니다.
  // 사용자가 보고 있는 운영현황/주간실적/정산/기사관리/단체문자 화면은 절대 변경하지 않습니다.
  const activePage=document.querySelector('.page-view.active');
  const activeId=activePage?.id||'';
  const activeNav=document.querySelector('.side-nav-btn.active');
  const activeNavPage=activeNav?.getAttribute('data-page')||'';

  await loadData();
  reconcileManageDrafts();

  // 다른 코드가 실수로 active class를 건드렸을 때만 원래 화면을 복구합니다.
  // 사용자가 갱신 도중 직접 다른 메뉴를 눌렀다면 그 새 화면을 우선합니다.
  const userPage=window.__USER_SELECTED_PAGE||'';
  const wanted=userPage||activeNavPage||(activeId.startsWith('page-')?activeId.slice(5):'');
  if(wanted){
    const now=document.querySelector('.page-view.active')?.id||'';
    if(now!==`page-${wanted}`){
      switchPage(wanted);
    }
  }
}

loadData();setInterval(refreshDashboardDataOnly,30000);
</script>
