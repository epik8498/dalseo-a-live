/* ===== 우리 달서팀 전용 UI 2.5 ===== */
:root{
  --ss-bg:#f4f6f8;--ss-surface:#fff;--ss-surface2:#f8fafc;--ss-text:#111827;
  --ss-sub:#6b7280;--ss-border:#e5e7eb;--ss-shadow:0 8px 28px rgba(17,24,39,.07);
  --ss-shadow-sm:0 3px 14px rgba(17,24,39,.055);--ss-red:#e60012;--ss-red-soft:#fff1f2
}
body{background:radial-gradient(circle at 50% -120px,rgba(230,0,18,.07),transparent 380px),var(--ss-bg)!important;color:var(--ss-text)}
body.dark{--ss-bg:#080b10;--ss-surface:#11151c;--ss-surface2:#171c24;--ss-text:#f9fafb;--ss-sub:#9ca3af;--ss-border:#252c36;background:radial-gradient(circle at 50% -120px,rgba(230,0,18,.12),transparent 380px),var(--ss-bg)!important}
.wrap{max-width:1080px!important;padding:18px 18px 70px!important}
.top{background:rgba(255,255,255,.88);backdrop-filter:blur(16px);border:1px solid var(--ss-border);border-radius:24px;padding:14px 18px 18px!important;box-shadow:var(--ss-shadow);margin-bottom:16px}
body.dark .top{background:rgba(17,21,28,.92)}
.top-actions{margin:0 0 8px!important;justify-content:flex-end!important}
.mode{border:1px solid var(--ss-border)!important;background:var(--ss-surface)!important;color:var(--ss-text)!important;border-radius:12px!important;padding:10px 14px!important;font-size:14px!important;box-shadow:none!important}
.logo-img{width:66px!important;min-height:40px!important}.brand{font-size:30px!important;margin-top:4px!important;letter-spacing:-1.5px}.sub{font-size:13px!important;color:var(--ss-sub);margin-top:5px!important}.area{margin:13px 0 5px!important;font-size:18px!important}.area b{display:inline-block;background:var(--ss-red-soft);color:var(--ss-red);border-radius:999px;padding:5px 10px}.top-update{margin:5px 0 0!important;font-size:12px!important;color:var(--ss-sub)!important}

/* 7 KPI = 3 / 3 / full width */
.summary{border:0!important;background:transparent!important;overflow:visible!important;margin:0 0 22px!important}
.summary-grid{grid-template-columns:repeat(3,minmax(0,1fr))!important;gap:10px!important}
.sum{min-height:106px!important;padding:16px 12px!important;border:1px solid var(--ss-border)!important;background:var(--ss-surface);border-radius:18px;box-shadow:var(--ss-shadow-sm);display:flex;flex-direction:column;justify-content:center}
.sum:last-child{grid-column:1/-1}
.sum-title{font-size:12px!important;color:var(--ss-sub)}.sum-val{margin-top:8px!important;font-size:26px!important}.sum-val.red{color:var(--ss-red)!important}.sum-val.green{color:#059669!important}

/* App shell */
.app-shell{display:grid;grid-template-columns:170px minmax(0,1fr);gap:16px;align-items:start}
.side-nav{position:sticky;top:14px;border:1px solid var(--ss-border);background:var(--ss-surface);border-radius:18px;padding:10px;box-shadow:var(--ss-shadow-sm)}
.side-nav-title{padding:8px 10px 10px;font-size:11px;color:var(--ss-sub);letter-spacing:.4px}
.side-nav-btn{display:block;width:100%;border:0;background:transparent;color:var(--ss-text);border-radius:11px;padding:11px 12px;margin:2px 0;text-align:left;font-size:13px;font-weight:1000;cursor:pointer}
.side-nav-btn:hover{background:var(--ss-surface2)}.side-nav-btn.active{background:var(--ss-red);color:#fff;box-shadow:0 5px 14px rgba(230,0,18,.18)}
.page-stage{min-width:0}.page-view{display:none}.page-view.active{display:block}.page-view .panel{display:block!important}.menu-hidden-toggle{display:none!important}

.section-title{margin:24px 2px 10px!important;gap:8px!important;font-size:19px!important}.section-title .icon{width:5px!important;height:20px!important;border-radius:999px!important;background:var(--ss-red)!important}.section-title small{font-size:12px!important;color:var(--ss-sub)!important}
.weekly-status,.mission-box{border:1px solid var(--ss-border)!important;background:var(--ss-surface)!important;border-radius:18px!important;box-shadow:var(--ss-shadow-sm)!important}
.weekly-grid{grid-template-columns:repeat(4,1fr)!important;gap:10px!important}.day-card{border:1px solid var(--ss-border)!important;background:var(--ss-surface)!important;border-radius:18px!important;padding:16px 14px!important;box-shadow:var(--ss-shadow-sm)!important}.day-label{font-size:25px!important}.day-date{font-size:11px!important}.period-row{font-size:13px!important;margin:8px 0!important}.day-total{font-size:13px!important}

.period-grid{grid-template-columns:repeat(4,1fr)!important;gap:10px!important}.period-card{border:1px solid var(--ss-border)!important;background:var(--ss-surface)!important;border-radius:18px!important;padding:16px!important;box-shadow:var(--ss-shadow-sm)!important}.period-head{font-size:17px!important;margin-bottom:5px!important}.period-sub{font-size:11px!important}.period-total{margin:14px 0 10px!important;font-size:25px!important}.total-bar{height:9px!important}.team-line{grid-template-columns:45px 1fr auto!important;gap:7px!important;font-size:11px!important;margin:9px 0!important}.team-name{font-size:12px!important}.small-bar{height:8px!important}

.controls{display:grid!important;grid-template-columns:minmax(240px,1fr) auto!important;gap:10px!important;align-items:center!important;margin:18px 0 10px!important;padding:10px;background:var(--ss-surface);border:1px solid var(--ss-border);border-radius:16px;box-shadow:var(--ss-shadow-sm)}
.rider-search{width:100%;height:40px;border:1px solid var(--ss-border);background:var(--ss-surface2);color:var(--ss-text);border-radius:11px;padding:0 13px;font-size:13px;font-weight:900;outline:none}
.rider-search:focus{border-color:rgba(230,0,18,.55);box-shadow:0 0 0 3px rgba(230,0,18,.08)}
.riders{grid-template-columns:repeat(3,1fr)!important;gap:10px!important}.rider{border:1px solid var(--ss-border)!important;background:var(--ss-surface)!important;border-radius:18px!important;padding:14px!important;box-shadow:var(--ss-shadow-sm)!important}.rider.active{background:linear-gradient(180deg,#f2fff8,#fff)!important;border:1px solid rgba(5,150,105,.38)!important}.rider-name{font-size:17px!important}.status{font-size:10px!important;padding:4px 7px!important}.stats{margin-top:11px!important}.stat small{font-size:10px!important;color:var(--ss-sub)}.stat b{font-size:15px!important}.times{margin-top:10px!important;padding-top:8px!important}.times div{font-size:10px!important;color:var(--ss-sub)}.times b{font-size:14px!important}
.rider-empty{grid-column:1/-1;text-align:center;color:var(--ss-sub);background:var(--ss-surface);border:1px dashed var(--ss-border);border-radius:16px;padding:28px 16px;font-size:13px}

@media(max-width:900px){.weekly-grid{grid-template-columns:repeat(2,1fr)!important}.period-grid{grid-template-columns:repeat(2,1fr)!important}.riders{grid-template-columns:repeat(2,1fr)!important}}
@media(max-width:760px){.app-shell{grid-template-columns:1fr;gap:10px}.side-nav{position:sticky;top:6px;z-index:15;display:flex;overflow-x:auto;gap:6px;padding:7px;border-radius:14px}.side-nav-title{display:none}.side-nav-btn{flex:0 0 auto;width:auto;white-space:nowrap;padding:9px 12px;margin:0;font-size:12px}}
@media(max-width:560px){.wrap{padding:10px 10px 54px!important}.top{border-radius:18px;padding:10px 12px 14px!important}.summary-grid{grid-template-columns:repeat(3,minmax(0,1fr))!important;gap:7px!important}.sum{min-height:82px!important;padding:11px 5px!important}.sum-title{font-size:9.5px!important}.sum-val{font-size:18px!important}.weekly-grid{grid-template-columns:1fr 1fr!important;gap:7px!important}.period-grid{grid-template-columns:1fr 1fr!important;gap:7px!important}.riders{grid-template-columns:1fr!important}.controls{grid-template-columns:1fr!important}.section-title{font-size:17px!important;margin-top:20px!important}}


/* ===== 우리 달서팀 최신 모바일 가독성 ===== */
.dalseo-metric-pair{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:12px}
.dalseo-metric{border-radius:13px;padding:10px 12px}
.dalseo-metric small{display:block;font-size:10px;font-weight:1000;margin-bottom:3px}
.dalseo-metric b{display:block;font-size:27px;line-height:1;font-weight:1000}
.dalseo-metric.done{background:rgba(230,0,18,.07);border:1px solid rgba(230,0,18,.15);color:var(--ss-red)}
.dalseo-metric.goal{background:rgba(0,111,214,.065);border:1px solid rgba(0,111,214,.14);color:#006fd6}
body.dark .dalseo-metric.goal{color:#69b7ff}
.dalseo-team-row{display:grid;grid-template-columns:1fr auto auto auto;gap:6px;align-items:center;border-top:1px solid var(--ss-border);margin-top:10px;padding-top:10px;font-size:14px;font-weight:1000}
.dalseo-team-row .done-num{color:var(--ss-red);font-size:16px}
.dalseo-team-row .goal-num{color:#006fd6;font-size:16px}
body.dark .dalseo-team-row .goal-num{color:#69b7ff}
.dalseo-team-row i{font-style:normal;color:var(--ss-sub)}

 body{font-size:15px!important}.wrap{padding:10px 9px 54px!important}
 .brand{font-size:27px!important}.sub{font-size:12px!important}.area{font-size:17px!important}.top-update{font-size:11px!important}

 .period-card{padding:13px 10px!important}.period-head{font-size:17px!important}
 .dalseo-metric b{font-size:25px}.dalseo-team-row{font-size:14px}.dalseo-team-row .done-num,.dalseo-team-row .goal-num{font-size:17px}
 .rider-search{height:44px!important;font-size:15px!important}.rider{padding:15px 14px!important}.rider-name{font-size:18px!important}
 .stat b{font-size:16px!important}.times b{font-size:15px!important}
 .day-label{font-size:24px!important}.period-row{font-size:13px!important}.day-total{font-size:13px!important}
}

</style>
</head>
<body>
<div class="wrap">
  <div class="top">
    <div class="top-actions"><button class="mode" onclick="toggleMode()" id="modeBtn">🌙 다크 모드</button></div>
    <img src="logo.png" class="logo-img" onerror="this.style.display='none'">
    <div class="brand">SUPERSONIC</div><div class="sub">우리 달서팀 · LIVE OPERATIONS</div>
    <div class="area">현재 권역 : <b id="areaText">-</b></div>
    <div class="top-update" id="topUpdateTime">↻ 마지막 업데이트 : -</div>
  </div>
  <div id="errorBox"></div>
  <div class="summary"><div class="summary-grid">
    <div class="sum"><div class="sum-title">주간 완료</div><div class="sum-val red" id="weekComplete">0</div></div>
    <div class="sum"><div class="sum-title">주간 수락률</div><div class="sum-val" id="weekRate">0%</div></div>
    <div class="sum"><div class="sum-title">주간 여유거절</div><div class="sum-val green" id="weekSpare">0</div></div>
    <div class="sum"><div class="sum-title">전체 접속</div><div class="sum-val green" id="onlineCount">0명</div></div>
    <div class="sum"><div class="sum-title">당일 발주량</div><div class="sum-val" id="dayOrder">0</div></div>
    <div class="sum"><div class="sum-title">당일 완료</div><div class="sum-val red" id="dayComplete">0</div></div>
    <div class="sum"><div class="sum-title" id="teamCountTitle">접속중</div><div class="sum-val red" id="teamCount">0</div></div>
  </div></div>

  <div class="app-shell">
    <aside class="side-nav">
      <div class="side-nav-title">우리 달서팀</div>
      <button class="side-nav-btn active" data-page="overview" onclick="switchPage('overview',this)">운영현황</button>
      <button class="side-nav-btn" data-page="weekly" onclick="switchPage('weekly',this)">주간실적</button>
    </aside>
    <main class="page-stage">

      <section class="page-view active" id="page-overview">
        <div class="section-title"><span class="icon"></span>구간별 실적 <small>(완료 / 발주량)</small></div>
        <div class="period-grid" id="periodCards"></div>
        <div class="controls">
          <input id="riderSearch" class="rider-search" type="search" inputmode="search"
            placeholder="기사명 / 전화번호 / 아이디 검색" autocomplete="off"
            oninput="setRiderSearch(this.value)">
          <div class="sort">정렬:<select id="sortSelect" onchange="renderFiltersAndRiders()"><option value="complete">완료순</option><option value="name">가나다순</option></select></div>
        </div>
        <div class="filters" id="filters" style="display:none"></div>
        <div class="riders" id="riderGrid"></div>
        <div class="footer" id="footerTime">마지막 업데이트 : -</div>
      </section>

      <section class="page-view" id="page-weekly">
        <div class="section-title"><span class="icon"></span>달서팀 주간실적 <small id="weekRange">-</small></div>
        <div id="weeklyStatus"></div>
        <div class="weekly-grid" id="weeklyGrid"></div>
      </section>

    </main>
  </div>
</div>
<script>
const FIREBASE_BASE="https://supersonic-l-default-rtdb.asia-southeast1.firebasedatabase.app";
const AREAS={
  "달서A":{
    file:"/live/dalseoa",
    weekly:"/weekly/dalseoa",
    teams:["달서팀"],
    labels:{"달서팀":"달서"},
    classes:{"달서팀":"dalseo"},
    missionTeam:"달서팀"
  }
};
const PERIODS=[['morning','☀','오전피크'],['afternoon','☀','오후논피크'],['evening','🌇','저녁피크'],['midnight','🌙','심야논피크']];
let DATA=null,WEEKLY=[],CURRENT='달서A',FILTER='달서팀',RIDER_SEARCH='',CURRENT_PAGE='overview';
function n(v){return Number(v||0).toLocaleString('ko-KR')}function won(v){return Number(v||0).toLocaleString('ko-KR')+'원'}function pct(a,b){return !b?0:Math.min(100,Math.round((a/b)*100))}function areaCfg(){return AREAS[CURRENT]}function teamObj(name){return (DATA&&DATA.teams&&DATA.teams[name])||{summary:{},targets:{},riders:[]}}function badTotal(row){return Number(row.totalReject||row.reject||0)+Number(row.totalCancel||row.cancel||0)+Number(row.riderFault||0)}function acceptRate(c,b){c=Number(c||0);b=Number(b||0);return (c+b)?Math.round((c/(c+b))*1000)/10:100}function spare(c,b){c=Number(c||0);b=Number(b||0);return Math.floor(c*.25)-b}function hsum(r,a,b){const h=Array.isArray(r.hourly)?r.hourly:[];let s=0;for(let i=a;i<b;i++)s+=Number(h[i]||0);return s}function morningExcluded(r){return Number(r.morningExcluded!=null?r.morningExcluded:hsum(r,6,9))}function midnightExcluded(r){return Number(r.midnightExcluded!=null?r.midnightExcluded:hsum(r,0,6))}function riderExcluded(r){return Number(r.excluded!=null?r.excluded:(morningExcluded(r)+midnightExcluded(r)))}function teamExcluded(team){let obj=teamObj(team);if(obj.summary&&obj.summary.excluded!=null)return Number(obj.summary.excluded||0);return (obj.riders||[]).reduce((s,r)=>s+riderExcluded(r),0)}function periodExcluded(key){const riders=(DATA&&DATA.riders)||[];if(key==='morning')return riders.reduce((s,r)=>s+morningExcluded(r),0);if(key==='midnight')return riders.reduce((s,r)=>s+midnightExcluded(r),0);return 0}
function toggleAreaMenu(){}
function selectArea(area){CURRENT='달서A';FILTER='달서팀';RIDER_SEARCH='';loadData()}
function setFilter(v){FILTER='달서팀';renderFiltersAndRiders()}
function setRiderSearch(v){RIDER_SEARCH=String(v||'').trim().toLowerCase();renderFiltersAndRiders()}
function switchPage(page,btn){
  CURRENT_PAGE=page;
  document.querySelectorAll('.page-view').forEach(el=>el.classList.remove('active'));
  const target=document.getElementById('page-'+page);if(target)target.classList.add('active');
  document.querySelectorAll('.side-nav-btn').forEach(el=>el.classList.remove('active'));
  if(btn)btn.classList.add('active');else{const b=document.querySelector(`.side-nav-btn[data-page="${page}"]`);if(b)b.classList.add('active')}
  
}function toggleMode(){document.body.classList.toggle('dark');const dark=document.body.classList.contains('dark');localStorage.setItem('mode',dark?'dark':'light');document.getElementById('modeBtn').innerText=dark?'☀ 라이트 모드':'🌙 다크 모드'}if(localStorage.getItem('mode')==='dark'){document.body.classList.add('dark')}
function togglePanel(id,btnId){const p=document.getElementById(id),b=document.getElementById(btnId),open=!p.classList.contains('show');p.classList.toggle('show',open);b.innerText=b.innerText.replace(open?'보기 ▾':'닫기 ▴',open?'닫기 ▴':'보기 ▾')}
function renderAreaMenu(){}
async function fetchJson(path){
  const url=FIREBASE_BASE+path+".json?v="+Date.now();
  const r=await fetch(url,{cache:'no-store'});
  if(!r.ok)throw new Error(path);
  const data=await r.json();
  if(data===null||data===undefined)throw new Error(path+" empty");
  return data;
}
async function loadData(){renderAreaMenu();try{DATA=await fetchJson(areaCfg().file);try{WEEKLY=await fetchJson(areaCfg().weekly)}catch(e){WEEKLY=DATA.weekly||[]}document.getElementById('errorBox').innerHTML='';render()}catch(e){DATA=null;document.getElementById('errorBox').innerHTML=`<div class="error">${CURRENT} 데이터를 읽지 못했습니다.<br>Firebase 업로드와 Realtime Database 상태를 확인하세요.</div>`}}
function buildWeeklySummary(){
  const rows=Array.isArray(WEEKLY)?WEEKLY:[];
  const byDate=Object.fromEntries(rows.map(x=>[x.businessDate,x]));
  const labels=['수','목','금','토','일','월','화'];

  let baseDates=[];
  if(DATA&&DATA.weeklySummary&&DATA.weeklySummary.days){
    baseDates=DATA.weeklySummary.days.map(x=>x.businessDate);
  }else{
    let last=rows.length?new Date(rows[rows.length-1].businessDate):new Date();
    let diff=(last.getDay()-3+7)%7,start=new Date(last);
    start.setDate(last.getDate()-diff);
    for(let i=0;i<7;i++){let d=new Date(start);d.setDate(start.getDate()+i);baseDates.push(d.toISOString().slice(0,10))}
  }

  const days=baseDates.map((dk,i)=>{
    const row=byDate[dk]||{};
    const stored=row.teams&&row.teams['달서팀'];
    if(!stored){
      return {label:labels[i],date:dk,has:false,complete:0,bad:0,excluded:0,rate:100,periods:PERIODS.map(([key,,label])=>({key,label,done:0,goal:0,fail:false,ok:false})),ok:false,failPeriods:[]};
    }
    const sm=stored.summary||stored||{},tg=stored.targets||{};
    const complete=Number(sm.complete||0);
    const bad=Number(sm.reject||0)+Number(sm.cancel||0)+Number(sm.riderFault||0);
    const excluded=Number(sm.excluded||0);
    const rate=sm.acceptRate!=null?Number(sm.acceptRate):acceptRate(complete,bad);
    const periods=PERIODS.map(([key,,label])=>{
      const done=Number(sm[key]||0),goal=Number(tg[key]||0);
      return {key,label,done,goal,fail:goal>0&&done<goal,ok:goal>0&&done>=goal};
    });
    const failPeriods=periods.filter(p=>p.fail);
    return {label:labels[i],date:dk,has:true,complete,bad,excluded,rate,periods,ok:failPeriods.length===0,failPeriods};
  });
  return {days,start:baseDates[0]||'-',end:baseDates[baseDates.length-1]||'-'};
}
function render(){
  const d=DATA;if(!d)return;
  const cfg=areaCfg(),team=teamObj('달서팀'),sm=team.summary||{},tg=team.targets||{},ws=buildWeeklySummary();

  document.getElementById('modeBtn').innerText=document.body.classList.contains('dark')?'☀ 라이트 모드':'🌙 다크 모드';
  document.getElementById('areaText').innerText='달서A · 달서팀';
  document.getElementById('topUpdateTime').innerText='↻ 마지막 업데이트 : '+(d.updatedAt||'-');
  document.getElementById('footerTime').innerText='↻ 마지막 업데이트 : '+(d.updatedAt||'-');
  document.getElementById('weekRange').innerText=ws.start+' ~ '+ws.end;

  const weeklyComplete=ws.days.reduce((s,x)=>s+Number(x.complete||0),0);
  const weeklyBad=ws.days.reduce((s,x)=>s+Number(x.bad||0),0);

  document.getElementById('weekComplete').innerText=n(weeklyComplete);
  document.getElementById('weekRate').innerText=acceptRate(weeklyComplete,weeklyBad)+'%';
  document.getElementById('weekSpare').innerText=n(spare(weeklyComplete,weeklyBad));
  document.getElementById('dayComplete').innerText=n(sm.complete||0);
  document.getElementById('dayOrder').innerText=n(tg.total||0);
  document.getElementById('onlineCount').innerText=n(sm.onlineCount||0)+'명';
  document.getElementById('teamCountTitle').innerText='달서팀 전체 기사';
  document.getElementById('teamCount').innerText=n(sm.count||0)+'명';

  renderWeekly(ws);
  renderPeriods();
  renderFiltersAndRiders();
  switchPage('overview');
}
function renderWeekly(ws){
  const failed=ws.days.filter(x=>x.has&&!x.ok);
  const excludedTotal=ws.days.reduce((s,d)=>s+Number(d.excluded||0),0);
  document.getElementById('weeklyStatus').innerHTML=`<div class="weekly-status">
    <div class="status-line"><span>달서팀 주간 미션 결과</span>${failed.length?`<span class="badge fail">실패 ${failed.length}일</span>`:`<span class="badge ok">전체 성공</span>`}</div>
    ${failed.length?`<div style="margin-top:10px;color:var(--muted);font-size:13px;font-weight:1000">실패일: ${failed.map(d=>d.label+'('+d.failPeriods.map(p=>p.label).join('/')+')').join(', ')}</div>`:''}
    <div class="excluded-note">달서팀 실적 미포함건 총 ${n(excludedTotal)}건</div>
  </div>`;

  document.getElementById('weeklyGrid').innerHTML=ws.days.map(day=>`<div class="day-card">
    <div class="day-head"><div class="day-label">${day.label}</div><div class="day-date">${day.date}</div></div>
    ${day.periods.map(p=>`<div class="period-row ${p.fail?'fail':p.ok?'ok':''}"><div class="pname">${p.label}</div><div class="pval">${day.has?n(p.done):'-'} / ${day.has&&p.goal>0?n(p.goal):'-'}</div></div>`).join('')}
    ${day.has&&day.excluded?`<div class="period-row"><div class="pname">미포함</div><div class="pval" style="color:#b15b00">${n(day.excluded)}건</div></div>`:''}
    <div class="day-line"></div>
    <div class="day-total"><b>완료 ${day.has?n(day.complete):'-'}</b><br><b>거절합계 ${day.has?n(day.bad):'-'}</b><br><b>수락률 ${day.has?day.rate+'%':'-'}</b></div>
    <div class="day-result">${!day.has?'<span class="badge wait">기록없음</span>':day.ok?'<span class="badge ok">성공</span>':`<span class="badge fail">실패: ${day.failPeriods.map(p=>p.label).join(', ')}</span>`}</div>
  </div>`).join('');
}

function periodIncludedDone(team,key){
  // 수집기에서 morning/afternoon/evening/midnight는 이미 SLA 포함 구간만 계산되어 들어옵니다.
  // 오전/심야 미포함은 표시 전용이므로 여기서 다시 차감하지 않습니다.
  return Number(teamObj(team).summary[key]||0);
}

function renderPeriods(){
  const team='달서팀';
  document.getElementById('periodCards').innerHTML=PERIODS.map(([key,icon,label])=>{
    const done=periodIncludedDone(team,key),goal=Number(teamObj(team).targets[key]||0);
    return `<div class="period-card dalseo-simple">
      <div class="period-head">${icon} ${label}</div>
      <div class="dalseo-metric-pair">
        <div class="dalseo-metric done"><small>완료</small><b>${n(done)}</b></div>
        <div class="dalseo-metric goal"><small>발주</small><b>${n(goal)}</b></div>
      </div>
      <div class="dalseo-team-row"><span>달서</span><strong class="done-num">${n(done)}</strong><i>/</i><strong class="goal-num">${n(goal)}</strong></div>
    </div>`;
  }).join('');
}
function renderFiltersAndRiders(){
  let riders=[...(DATA.riders||[])].filter(r=>r.team==='달서팀');
  if(RIDER_SEARCH){
    const q=RIDER_SEARCH.replace(/\s+/g,'');
    riders=riders.filter(r=>{
      const name=String(r.name||'').toLowerCase().replace(/\s+/g,'');
      const phone=String(r.phone||'').toLowerCase().replace(/[\s-]+/g,'');
      const userId=String(r.userId||'').toLowerCase().replace(/\s+/g,'');
      return name.includes(q)||phone.includes(q)||userId.includes(q);
    });
  }
  const sort=document.getElementById('sortSelect').value;
  if(sort==='name')riders.sort((a,b)=>a.isOnline!==b.isOnline?b.isOnline-a.isOnline:a.name.localeCompare(b.name,'ko'));
  else riders.sort((a,b)=>a.isOnline!==b.isOnline?b.isOnline-a.isOnline:Number(b.complete||0)-Number(a.complete||0));

  document.getElementById('riderGrid').innerHTML=riders.length?riders.map(r=>{
    const miss=riderExcluded(r);
    return `<div class="rider ${r.isOnline?'active':''}"><div class="rider-top"><div class="rider-name"><span class="dot"></span>${r.name}</div><div><span class="status">${r.isOnline?'접속중':'운행종료'}</span>${r.warning?'<span class="warn">80%↓</span>':''}</div></div><div class="stats"><div class="stat"><small>완료<span class="miss-label">/미포함</span></small><b class="red">${n(r.complete)}<span class="miss"> / ${n(miss)}건</span></b></div><div class="stat"><small>거절/취소</small><b>${n(r.reject)} / ${n(r.cancel)}</b></div><div class="stat"><small>수락률</small><b>${r.acceptRate}%</b></div></div><div class="times"><div>오전<b>${n(r.morning)}</b></div><div>오후<b>${n(r.afternoon)}</b></div><div>저녁<b>${n(r.evening)}</b></div><div>심야<b>${n(r.midnight)}</b></div></div></div>`;
  }).join(''):'<div class="rider-empty">검색 결과가 없습니다.</div>';
}
function renderMission(){if(!DATA)return;const cfg=areaCfg(),period=document.getElementById('missionPeriod').value,need=Number(document.getElementById('missionCount').value||0),price=Number(document.getElementById('missionPrice').value||0);let riders=[...(DATA.riders||[])];if(cfg.missionTeam)riders=riders.filter(r=>r.team===cfg.missionTeam);let success=need>0?riders.filter(r=>Number(r[period]||0)>=need):[];success.sort((a,b)=>Number(b[period]||0)-Number(a[period]||0));document.getElementById('missionTarget').innerText=n(riders.length)+'명';document.getElementById('missionSuccess').innerText=n(success.length)+'명';document.getElementById('missionTotal').innerText=won(success.length*price);document.getElementById('missionList').innerHTML=need>0?success.map(r=>`<div class="mission-rider"><b>${r.name}</b><span>${n(r[period])}건 / ${won(price)}</span></div>`).join(''):`<div style="grid-column:1/-1;color:var(--muted);font-weight:1000;text-align:center;padding:16px">목표 건수를 입력하면 성공기사가 표시됩니다.</div>`}
loadData();setInterval(loadData,120000);
</script>
</body>
</html>
