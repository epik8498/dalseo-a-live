<style>

ound:rgba(15,15,15,.82)}.summary-grid{display:grid;grid-template-columns:repeat(3,1fr)}.sum{min-height:118px;padding:25px 8px 20px;text-align:center;border-right:1px solid var(--line);border-bottom:1px solid var(--line)}.sum:nth-child(3n){border-right:0}.sum:nth-last-child(-n+3){border-bottom:0}.sum-title{font-size:17px;font-weight:1000;line-height:1.3}.sum-val{margin-top:13px;font-size:32px;font-weight:1000;letter-spacing:-1px}.sum-val.red{color:var(--red)}.sum-val.green{color:var(--green)}.section-title{margin:28px 0 14px;display:flex;align-items:center;gap:12px;font-size:30px;font-weight:1000;letter-spacing:-1px}.section-title .icon{display:inline-block;width:11px;height:34px;background:var(--red);border-radius:2px}.section-title small{font-size:18px;color:var(--muted);font-weight:1000}.toggle-btn{width:100%;border:0;border-radius:16px;background:var(--red);color:#fff;font-size:19px;font-weight:1000;padding:20px 16px;margin:8px 0 22px;box-shadow:0 10px 18px rgba(230,0,18,.22);cursor:pointer}.panel{display:none}.panel.show{display:block}.weekly-status{border:1px solid var(--line);background:var(--card);border-radius:18px;padding:16px;margin-bottom:14px}.status-line{display:flex;justify-content:space-between;gap:8px;align-items:center;font-size:17px;font-weight:1000}.badge{display:inline-block;border-radius:999px;padding:7px 12px;font-size:14px;font-weight:1000}.badge.ok{background:#e8fff2;color:#008a43}.badge.fail{background:#fff0f0;color:var(--red)}.badge.wait{background:#f1f1f1;color:#666}.weekly-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:14px;margin-bottom:26px}.day-card{border:1px solid var(--line);border-radius:22px;background:var(--card);padding:22px 18px;box-shadow:0 3px 10px rgba(0,0,0,.03)}body.dark .day-card{background:rgba(18,18,18,.92);box-shadow:none}.day-head{text-align:center}.day-label{font-size:34px;color:var(--red);font-weight:1000;line-height:1}.day-date{font-size:16px;color:var(--muted);font-weight:1000;margin-top:9px}.period-row{display:grid;grid-template-columns:1fr auto;gap:8px;margin:10px 0;font-size:18px}.period-row .pname{color:var(--muted);font-weight:1000}.period-row.fail .pval{color:var(--red)}.period-row.ok .pval{color:var(--text)}.day-line{height:1px;background:var(--line);margin:16px 0}.day-total{text-align:center;font-size:18px;line-height:1.6}.day-result{text-align:center;margin-top:12px}.period-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:14px;margin-bottom:26px}.period-card{background:var(--card);border:1px solid var(--line);border-radius:22px;padding:24px;box-shadow:0 4px 14px rgba(0,0,0,.04)}body.dark .period-card{box-shadow:none;background:rgba(20,20,20,.9)}.period-head{font-size:25px;font-weight:1000;margin-bottom:12px}.period-sub{font-size:16px;color:var(--muted);font-weight:1000}.period-total{margin:24px 0 18px;text-align:center;font-size:32px;font-weight:1000}.period-total span:first-child{color:var(--red)}.total-bar{height:18px;background:#e9e9e9;border-radius:999px;overflow:hidden;margin-bottom:18px}body.dark .total-bar{background:#333}.total-fill{height:100%;background:var(--red);border-radius:999px}.team-line{display:grid;grid-template-columns:52px 1fr auto;align-items:center;gap:10px;font-size:16px;font-weight:1000;margin:12px 0}.team-name{font-size:17px}.team-num .done{color:var(--red)}.team-num .goal{color:var(--blue)}.small-bar{height:14px;background:#ececec;border-radius:999px;overflow:hidden}body.dark .small-bar{background:#333}.small-fill.sonic{height:100%;background:var(--red)}.small-fill.number{height:100%;background:var(--blue)}.small-fill.maeum,.small-fill.dalseo{height:100%;background:var(--purple)}.mission-box{border:1px solid var(--line);background:var(--card);border-radius:22px;padding:18px;margin-bottom:18px}.mission-form{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px}.field label{display:block;font-size:14px;color:var(--muted);font-weight:1000;margin-bottom:7px}.field input,.field select{width:100%;border:1px solid var(--line);background:var(--bg);color:var(--text);border-radius:12px;padding:13px 12px;font-size:16px;font-weight:1000}.mission-result{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:14px}.mission-stat{border:1px solid var(--line);border-radius:14px;padding:13px;text-align:center}.mission-stat small{display:block;color:var(--muted);font-size:13px}.mission-stat b{display:block;margin-top:6px;font-size:22px;color:var(--red)}.mission-list{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin-top:14px}.mission-rider{border:1px solid var(--line);border-radius:14px;padding:13px;background:var(--soft);display:flex;justify-content:space-between;gap:8px}.mission-rider b{font-size:17px}.mission-rider span{font-size:15px;color:var(--red);font-weight:1000}.controls{display:flex;justify-content:space-between;align-items:center;gap:10px;margin:22px 0 14px}.filters{display:flex;gap:10px;flex-wrap:wrap}.filters button{min-width:82px;border:1px solid var(--line);background:var(--card);color:var(--text);border-radius:10px;padding:12px 15px;font-weight:1000;cursor:pointer}.filters button.active{background:var(--red);border-color:var(--red);color:#fff}.sort{display:flex;align-items:center;gap:8px;font-weight:1000}.sort select{border:1px solid var(--line);background:var(--card);color:var(--text);border-radius:10px;padding:12px 16px;font-weight:1000}.riders{display:grid;grid-template-columns:1fr 1fr;gap:12px}.rider{background:var(--card);border:1.5px solid #222;border-radius:16px;padding:15px 16px;box-shadow:0 4px 14px rgba(0,0,0,.05)}body.dark .rider{background:rgba(18,18,18,.92);box-shadow:none;border-color:#777}.rider.active{background:#eafff1;border:2.5px solid var(--green);color:#111}body.dark .rider.active{background:#063b1d;border:2.5px solid var(--green);color:#fff}.rider-top{display:flex;justify-content:space-between;align-items:center;gap:8px}.rider-name{font-size:22px;font-weight:1000}.dot{display:inline-block;width:10px;height:10px;border-radius:999px;background:#bbb;margin-right:8px}.rider.active .dot{background:var(--green)}.status{font-size:11px;font-weight:1000;padding:5px 8px;border-radius:999px;background:#eee;color:#555}.rider.active .status{background:#d9ffe8;color:#006b2c}.warn{color:var(--orange);font-size:12px;font-weight:1000;margin-left:4px}.stats{display:grid;grid-template-columns:repeat(3,1fr);margin-top:14px;text-align:center}.stat{border-right:1px solid var(--line)}.stat:last-child{border-right:0}.stat small{display:block;font-size:12px;font-weight:1000}.stat b{display:block;margin-top:4px;font-size:18px}.stat b.red{color:var(--red)}.times{display:grid;grid-template-columns:repeat(4,1fr);border-top:1px solid var(--line);margin-top:12px;padding-top:10px;text-align:center}.times div{border-right:1px solid var(--line);font-size:12px;font-weight:1000}.times div:last-child{border-right:0}.times b{display:block;color:var(--red);font-size:16px;margin-top:3px}.footer{text-align:center;color:var(--muted);font-weight:1000;padding:24px 0 4px;display:none}
@media(max-width:760px){.wrap{padding:16px 24px 60px}.top-actions{margin:0 46px 12px}.summary-grid{grid-template-columns:repeat(3,1fr)}.sum{min-height:106px;padding:22px 4px 16px}.sum-title{font-size:16px}.sum-val{font-size:31px}.period-grid{grid-template-columns:1fr}.weekly-grid{grid-template-columns:1fr 1fr}.section-title{font-size:28px}.mission-form{grid-template-columns:1fr 1fr}.mission-form .field:first-child{grid-column:1/3}.mission-list{grid-template-columns:1fr}}
@media(max-width:540px){.wrap{padding:16px 24px 60px}.top-actions{margin:0 46px 12px}.move,.mode{padding:13px 15px;font-size:16px}.logo-img{width:88px}.brand{font-size:34px}.sub{font-size:18px}.area{font-size:20px}.top-update{font-size:17px}.area-menu{left:24px;top:66px}.summary{border-radius:22px}.sum{min-height:102px;padding:20px 2px 15px}.sum-title{font-size:15px}.sum-val{font-size:29px}.weekly-grid{grid-template-columns:1fr 1fr;gap:12px}.day-card{padding:20px 14px}.day-label{font-size:31px}.period-row{font-size:16px}.period-grid{grid-template-columns:1fr}.period-card{padding:24px}.riders{grid-template-columns:1fr}.controls{flex-direction:column;align-items:stretch}.filters{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}.filters button{min-width:0;padding:10px 4px}.sort{justify-content:flex-end}.mission-form{grid-template-columns:1fr}.mission-form .field:first-child{grid-column:auto}.mission-result{grid-template-columns:1fr 1fr 1fr}.mission-stat{padding:10px 4px}.mission-stat b{font-size:19px}}

.excluded-note{margin-top:10px;color:#b15b00;font-size:14px;font-weight:1000;line-height:1.45}body.dark .excluded-note{color:#ffbf66}.excluded-chips{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}.excluded-chip{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);border-radius:999px;padding:7px 11px;background:var(--soft);font-size:14px;font-weight:1000}.excluded-chip::before{content:'';display:inline-block;width:9px;height:9px;border-radius:999px;background:#999}.excluded-chip.sonic::before{background:var(--red)}.excluded-chip.number::before{background:var(--blue)}.excluded-chip.maeum::before,.excluded-chip.dalseo::before{background:var(--purple)}.period-excluded{margin-top:6px;color:#b15b00;font-size:14px;font-weight:1000}.stat b .miss{color:#b15b00;font-size:.82em;letter-spacing:-.5px}.stat small .miss-label{color:#b15b00}.rider .stat:first-child b{line-height:1.18}body.dark .stat b .miss,body.dark .stat small .miss-label{color:#ffbf66}
</style>

<body>
<div class="wrap">
  <div class="top">
    <div class="top-actions">
  <button class="move" onclick="toggleAreaMenu()">권역이동 ▾</button>
  <button class="mode" onclick="toggleMode()" id="modeBtn">🌙 다크 모드</button>
</div>
    <div class="area-menu" id="areaMenu"></div>
    <img src="logo.png" class="logo-img" onerror="this.style.display='none'">
    <div class="brand">SUPERSONIC</div><div class="sub">배민 | 쿠팡협력사</div>
    <div class="area">현재 권역 : <b id="areaText">-</b></div>
    <div class="top-update" id="topUpdateTime">↻ 마지막 업데이트 : -</div>
  </div>
  <div id="errorBox"></div>
  <div class="summary"><div class="summary-grid">
    <div class="sum"><div class="sum-title">주간 완료</div><div class="sum-val red" id="weekComplete">0</div></div>
    <div class="sum"><div class="sum-title">주간 거절합계</div><div class="sum-val" id="weekBad">0</div></div>
    <div class="sum"><div class="sum-title">주간 수락률</div><div class="sum-val" id="weekRate">0%</div></div>
    <div class="sum"><div class="sum-title">주간 여유거절</div><div class="sum-val green" id="weekSpare">0</div></div>
    <div class="sum"><div class="sum-title">전체 접속</div><div class="sum-val green" id="onlineCount">0명</div></div>
    <div class="sum"><div class="sum-title">당일 발주량</div><div class="sum-val" id="dayOrder">0</div></div>
    <div class="sum"><div class="sum-title">당일 완료</div><div class="sum-val red" id="dayComplete">0</div></div>
    <div class="sum"><div class="sum-title">당일 수락률</div><div class="sum-val" id="dayRate">0%</div></div>
    <div class="sum"><div class="sum-title">당일 여유거절</div><div class="sum-val red" id="daySpare">0</div></div>
    <div class="sum"><div class="sum-title" id="teamCountTitle">접속중</div><div class="sum-val red" id="teamCount">0</div></div>
  </div></div>

  <div class="section-title"><span class="icon"></span>주간실적 <small id="weekRange">-</small></div>
  <button class="toggle-btn" onclick="togglePanel('weeklyPanel','weeklyToggle')" id="weeklyToggle">주간실적 보기 ▾</button>
  <div class="panel" id="weeklyPanel"><div id="weeklyStatus"></div><div class="weekly-grid" id="weeklyGrid"></div></div>

  <div class="section-title"><span class="icon"></span>기사관리</div>
<button class="toggle-btn" onclick="togglePanel('managePanel','manageToggle')" id="manageToggle">기사관리 보기 ▾</button>
<div class="panel" id="managePanel">
  <div class="mission-box">
    <div id="manageList">
      기사 목록 로딩중...
    </div>
  </div>
</div>
  <div class="section-title"><span class="icon"></span>미션비 집계</div>
  <button class="toggle-btn" onclick="togglePanel('missionPanel','missionToggle')" id="missionToggle">미션비 집계 보기 ▾</button>
  <div class="panel" id="missionPanel">
    <div class="mission-box">
      <div class="mission-form">
        <div class="field"><label>구간 선택</label><select id="missionPeriod" onchange="renderMission()"><option value="morning">오전피크</option><option value="afternoon">오후논피크</option><option value="evening">저녁피크</option><option value="midnight">심야논피크</option></select></div>
        <div class="field"><label>목표 건수</label><input id="missionCount" type="number" inputmode="numeric" min="0" placeholder="예: 10" oninput="renderMission()"></div>
        <div class="field"><label>미션비</label><input id="missionPrice" type="number" inputmode="numeric" min="0" placeholder="예: 5000" oninput="renderMission()"></div>
      </div>
      <div class="mission-result">
        <div class="mission-stat"><small>대상 기사</small><b id="missionTarget">0명</b></div>
        <div class="mission-stat"><small>성공 기사</small><b id="missionSuccess">0명</b></div>
        <div class="mission-stat"><small>총 미션비</small><b id="missionTotal">0원</b></div>
      </div>
      <div class="mission-list" id="missionList"></div>
    </div>
  </div>

  <div class="section-title"><span class="icon"></span>구간별 실적 <small>(완료 / 발주량)</small></div>
  <div class="period-grid" id="periodCards"></div>
  <div class="controls"><div class="filters" id="filters"></div><div class="sort">정렬:<select id="sortSelect" onchange="render()"><option value="complete">완료순</option><option value="name">가나다순</option></select></div></div>
  <div class="riders" id="riderGrid"></div><div class="footer" id="footerTime">마지막 업데이트 : -</div>
</div>
<script>
const FIREBASE_BASE="https://supersonic-l-default-rtdb.asia-southeast1.firebasedatabase.app";
const AREAS={
  "달서A":{key:"dalseoa",file:"/live/dalseoa",weekly:"/weekly/dalseoa",teams:["소닉팀","달서팀"],labels:{"소닉팀":"소닉","달서팀":"달서"},classes:{"소닉팀":"sonic","달서팀":"dalseo"},missionTeam:null},
  "달서B":{key:"dalseob",file:"/live/dalseob",weekly:"/weekly/dalseob",teams:["소닉팀","넘버팀","마음팀"],labels:{"소닉팀":"소닉","넘버팀":"넘버","마음팀":"마음"},classes:{"소닉팀":"sonic","넘버팀":"number","마음팀":"maeum"},missionTeam:"소닉팀"},
  "중구A":{key:"junggua",file:"/live/junggua",weekly:"/weekly/junggua",teams:["소닉팀","넘버팀","마음팀"],labels:{"소닉팀":"소닉","넘버팀":"넘버","마음팀":"마음"},classes:{"소닉팀":"sonic","넘버팀":"number","마음팀":"maeum"},missionTeam:"소닉팀"}
};
const PERIODS=[['morning','☀','오전피크'],['afternoon','☀','오후논피크'],['evening','🌇','저녁피크'],['midnight','🌙','심야논피크']];
function initialArea(){
  const q=new URLSearchParams(location.search).get('area');
  return AREAS[q]?q:'달서A';
}
let DATA=null,WEEKLY=[],CURRENT=initialArea(),FILTER='전체';
function n(v){return Number(v||0).toLocaleString('ko-KR')}function won(v){return Number(v||0).toLocaleString('ko-KR')+'원'}function pct(a,b){return !b?0:Math.min(100,Math.round((a/b)*100))}function areaCfg(){return AREAS[CURRENT]}function teamObj(name){return (DATA&&DATA.teams&&DATA.teams[name])||{summary:{},targets:{},riders:[]}}function badTotal(row){return Number(row.totalReject||row.reject||0)+Number(row.totalCancel||row.cancel||0)+Number(row.riderFault||0)}function acceptRate(c,b){c=Number(c||0);b=Number(b||0);return (c+b)?Math.round((c/(c+b))*1000)/10:100}function spare(c,b){c=Number(c||0);b=Number(b||0);return Math.floor(c*.25)-b}function hsum(r,a,b){const h=Array.isArray(r.hourly)?r.hourly:[];let s=0;for(let i=a;i<b;i++)s+=Number(h[i]||0);return s}function morningExcluded(r){return r.morningExcluded!=null?Number(r.morningExcluded||0):hsum(r,6,10)}function midnightExcluded(r){return r.midnightExcluded!=null?Number(r.midnightExcluded||0):hsum(r,0,6)}function riderExcluded(r){return Number(r.excluded!=null?r.excluded:(morningExcluded(r)+midnightExcluded(r)))}function teamExcluded(team){let obj=teamObj(team);if(obj.summary&&obj.summary.excluded!=null)return Number(obj.summary.excluded||0);return (obj.riders||[]).reduce((s,r)=>s+riderExcluded(r),0)}function periodExcluded(key){const riders=(DATA&&DATA.riders)||[];if(key==='morning')return riders.reduce((s,r)=>s+morningExcluded(r),0);if(key==='midnight')return riders.reduce((s,r)=>s+midnightExcluded(r),0);return 0}
function toggleAreaMenu(){document.getElementById('areaMenu').classList.toggle('show')}function selectArea(area){CURRENT=area;FILTER='전체';const u=new URL(location.href);u.searchParams.set('area',area);history.replaceState(null,'',u);document.getElementById('areaMenu').classList.remove('show');loadData()}window.addEventListener('popstate',()=>{CURRENT=initialArea();FILTER='전체';loadData()})function setFilter(v){FILTER=v;render()}function toggleMode(){document.body.classList.toggle('dark');const dark=document.body.classList.contains('dark');localStorage.setItem('mode',dark?'dark':'light');document.getElementById('modeBtn').innerText=dark?'☀ 라이트 모드':'🌙 다크 모드'}if(localStorage.getItem('mode')==='dark'){document.body.classList.add('dark')}
function togglePanel(id,btnId){const p=document.getElementById(id),b=document.getElementById(btnId),open=!p.classList.contains('show');p.classList.toggle('show',open);b.innerText=b.innerText.replace(open?'보기 ▾':'닫기 ▴',open?'닫기 ▴':'보기 ▾')}
function renderAreaMenu(){document.getElementById('areaMenu').innerHTML=Object.keys(AREAS).map(a=>`<button onclick="selectArea('${a}')" class="${a===CURRENT?'active':''}">${a}</button>`).join('')}
async function fetchJson(path){
  const url=FIREBASE_BASE+path+".json?v="+Date.now();
  const r=await fetch(url,{
  cache:'no-store',
  headers:{
    'Cache-Control':'no-cache',
    'Pragma':'no-cache'
  }
});
  if(!r.ok)throw new Error(path);
  const data=await r.json();
  if(data===null||data===undefined)throw new Error(path+" empty");
  return data;
}
async function loadData(){renderAreaMenu();try{DATA=await fetchJson(areaCfg().file);if(DATA&&DATA.area&&DATA.area!==CURRENT){throw new Error(`권역 데이터 불일치: 화면=${CURRENT}, 데이터=${DATA.area}`)}try{WEEKLY=await fetchJson(areaCfg().weekly)}catch(e){WEEKLY=DATA.weekly||[]}document.getElementById('errorBox').innerHTML='';render()}catch(e){DATA=null;document.getElementById('errorBox').innerHTML=`<div class="error">${CURRENT} 데이터를 읽지 못했습니다.<br>${e.message||''}<br>Firebase 업로드와 Realtime Database 상태를 확인하세요.</div>`}}
function buildWeeklySummary(){const rows=Array.isArray(WEEKLY)?WEEKLY:[];const byDate=Object.fromEntries(rows.map(x=>[x.businessDate,x]));let days=[];let labels=['수','목','금','토','일','월','화'];let baseDates=[];if(DATA&&DATA.weeklySummary&&DATA.weeklySummary.days){baseDates=DATA.weeklySummary.days.map(x=>x.businessDate)}else{let last=rows.length?new Date(rows[rows.length-1].businessDate):new Date();let day=last.getDay();let diff=(day-3+7)%7;let start=new Date(last);start.setDate(last.getDate()-diff);for(let i=0;i<7;i++){let d=new Date(start);d.setDate(start.getDate()+i);baseDates.push(d.toISOString().slice(0,10))}}
let totals={complete:0,bad:0,spare:0,excluded:0};days=baseDates.map((dk,i)=>{let r=byDate[dk]||{};let complete=Number(r.totalComplete||0),bad=badTotal(r),excluded=Number(r.excluded||r.totalExcluded||0),rate=r.acceptRate!=null?Number(r.acceptRate):acceptRate(complete,bad);let periodTargets=r.periodTargets||((DATA&&DATA.weeklySummary&&DATA.weeklySummary.days&&DATA.weeklySummary.days[i])?Object.fromEntries(DATA.weeklySummary.days[i].periods.map(p=>[p.key,p.goal])):{});let periods=PERIODS.map(([key,,label])=>{let done=Number(r[key]||0),goal=Number(periodTargets[key]||0);return{key,label,done,goal,fail:!!r.businessDate&&goal>0&&done<goal,ok:!!r.businessDate&&goal>0&&done>=goal}});let has=!!r.businessDate;let failPeriods=periods.filter(p=>p.fail);let ok=has&&failPeriods.length===0;totals.complete+=complete;totals.bad+=bad;totals.excluded+=excluded;return{label:labels[i]||'',date:dk,has,complete,bad,excluded,rate,spare:r.spareRejects!=null?Number(r.spareRejects):spare(complete,bad),periods,ok,failPeriods,closedAt:r.closedAt||''}});totals.spare=spare(totals.complete,totals.bad);totals.rate=acceptRate(totals.complete,totals.bad);if(!totals.excluded&&DATA&&DATA.total&&DATA.total.excluded!=null)totals.excluded=Number(DATA.total.excluded||0);return{days,start:baseDates[0]||'-',end:baseDates[baseDates.length-1]||'-',...totals}}
function render(){const d=DATA;if(!d)return;const cfg=areaCfg(),teams=cfg.teams,totalOrder=teams.reduce((s,t)=>s+Number(teamObj(t).targets.total||0),0),ws=buildWeeklySummary();document.getElementById('modeBtn').innerText=document.body.classList.contains('dark')?'☀ 라이트 모드':'🌙 다크 모드';document.getElementById('areaText').innerText=d.area||CURRENT;document.getElementById('topUpdateTime').innerText='↻ 마지막 업데이트 : '+(d.updatedAt||'-');document.getElementById('footerTime').innerText='↻ 마지막 업데이트 : '+(d.updatedAt||'-');document.getElementById('weekRange').innerText=ws.start+' ~ '+ws.end;document.getElementById('weekComplete').innerText=n(ws.complete);document.getElementById('weekBad').innerText=n(ws.bad);document.getElementById('weekRate').innerText=ws.rate+'%';document.getElementById('weekSpare').innerText=n(ws.spare);document.getElementById('dayComplete').innerText=n(d.total.complete);document.getElementById('dayOrder').innerText=n(totalOrder);document.getElementById('dayRate').innerText=(d.total.acceptRate||0)+'%';document.getElementById('daySpare').innerText=n(d.total.spareRejects);document.getElementById('onlineCount').innerText=n(d.total.onlineCount)+'명';document.getElementById('teamCountTitle').innerText='접속중('+teams.map(t=>cfg.labels[t]).join('/')+')';document.getElementById('teamCount').innerText=teams.map(t=>n(teamObj(t).summary.onlineCount)).join('/');renderWeekly(ws);renderPeriods();renderFiltersAndRiders();renderMission();renderManageList();}
function renderWeekly(ws){
  let failed=ws.days.filter(x=>x.has&&!x.ok);
  const cfg=areaCfg(),teams=cfg.teams;
  const excludedTotal=DATA&&DATA.total&&DATA.total.excluded!=null?Number(DATA.total.excluded||0):Number(ws.excluded||0);
  const teamChips=teams.map(t=>`<span class="excluded-chip ${cfg.classes[t]}">${cfg.labels[t]} ${n(teamExcluded(t))}건</span>`).join('');

  document.getElementById('weeklyStatus').innerHTML=`<div class="weekly-status"><div class="status-line"><span>주간 미션 결과</span>${failed.length?`<span class="badge fail">실패 ${failed.length}일</span>`:`<span class="badge ok">전체 성공</span>`}</div>${failed.length?`<div style="margin-top:10px;color:var(--muted);font-size:14px;font-weight:1000">실패일: ${failed.map(d=>d.label+'('+d.failPeriods.map(p=>p.label).join('/')+')').join(', ')}</div>`:`<div style="margin-top:10px;color:var(--muted);font-size:14px;font-weight:1000">기록된 모든 날짜가 구간 목표를 달성했습니다.</div>`}<div class="excluded-note">실적 미포함건 총 ${n(excludedTotal)}건</div><div class="excluded-chips">${teamChips}</div></div>`;

  document.getElementById('weeklyGrid').innerHTML=ws.days.map(day=>`<div class="day-card"><div class="day-head"><div class="day-label">${day.label}</div><div class="day-date">${day.date}</div></div>${day.periods.map(p=>`<div class="period-row ${p.fail?'fail':p.ok?'ok':''}"><div class="pname">${p.label}</div><div class="pval">${n(p.done)} / ${n(p.goal)}</div></div>`).join('')}${day.excluded?`<div class="period-row"><div class="pname">미포함</div><div class="pval" style="color:#b15b00">${n(day.excluded)}건</div></div>`:''}<div class="day-line"></div><div class="day-total"><b>완료 ${n(day.complete)}</b><br><b>거절합계 ${n(day.bad)}</b><br><b>수락률 ${day.rate}%</b>${day.excluded?`<div style="margin-top:8px;color:#b15b00;font-size:14px;font-weight:1000;line-height:1.45">미포함 실적 ${n(day.excluded)}건</div>`:''}</div><div class="day-result">${!day.has?'<span class="badge wait">기록없음</span>':day.ok?'<span class="badge ok">성공</span>':`<span class="badge fail">실패: ${day.failPeriods.map(p=>p.label).join(', ')}</span>`}</div></div>`).join('');
}

function periodIncludedDone(team,key){
  // d_a.py에서 이미 SLA 포함 구간만 summary[key]에 저장합니다.
  // 여기서 미포함을 다시 빼면 게이지가 이중 차감됩니다.
  return Number(teamObj(team).summary[key]||0);
}

function renderPeriods(){
  const cfg=areaCfg(),teams=cfg.teams;

  document.getElementById('periodCards').innerHTML=PERIODS.map(([key,icon,label])=>{
    const totalDone=teams.reduce((s,t)=>s+periodIncludedDone(t,key),0),
          totalGoal=teams.reduce((s,t)=>s+Number(teamObj(t).targets[key]||0),0),
          miss=periodExcluded(key);

    return `<div class="period-card"><div class="period-head">${icon} ${label.replace('피크',' 피크').replace('논피크',' 논피크')}</div><div class="period-sub">완료 / 발주량</div>${miss?`<div class="period-excluded">미포함 실적 - ${n(miss)}건</div>`:''}<div class="period-total"><span>${n(totalDone)}</span> / <span>${n(totalGoal)}</span></div><div class="total-bar"><div class="total-fill" style="width:${pct(totalDone,totalGoal)}%"></div></div>${teams.map(t=>{let done=periodIncludedDone(t,key),goal=Number(teamObj(t).targets[key]||0),fail=goal>0&&done<goal;return `<div class="team-line"><div class="team-name">${cfg.labels[t]}</div><div class="small-bar"><div class="small-fill ${cfg.classes[t]}" style="width:${pct(done,goal)}%"></div></div><div class="team-num"><span class="done">${n(done)}</span> / <span class="goal">${n(goal)}</span>${fail?' <span style="color:var(--red)">실패</span>':''}</div></div>`}).join('')}</div>`;
  }).join('');
}
function renderFiltersAndRiders(){const cfg=areaCfg(),teams=cfg.teams;document.getElementById('filters').innerHTML=[['전체','전체'],...teams.map(t=>[t,t])].map(([v,l])=>`<button onclick="setFilter('${v}')" class="${FILTER===v?'active':''}">${l}</button>`).join('');let riders=[...(DATA.riders||[])];if(FILTER!=='전체')riders=riders.filter(r=>r.team===FILTER);let sort=document.getElementById('sortSelect').value;if(sort==='name'){riders.sort((a,b)=>{if(a.isOnline!==b.isOnline)return b.isOnline-a.isOnline;return a.name.localeCompare(b.name,'ko')})}else{riders.sort((a,b)=>{if(a.isOnline!==b.isOnline)return b.isOnline-a.isOnline;return Number(b.complete||0)-Number(a.complete||0)})}document.getElementById('riderGrid').innerHTML=riders.map(r=>{const miss=riderExcluded(r);return `<div class="rider ${r.isOnline?'active':''}"><div class="rider-top"><div class="rider-name"><span class="dot"></span>${r.name}</div><div><span class="status">${r.isOnline?'접속중':'운행종료'}</span>${r.warning?'<span class="warn">80%↓</span>':''}</div></div><div class="stats"><div class="stat"><small>완료<span class="miss-label">/미포함</span></small><b class="red">${n(r.complete)}<span class="miss"> / ${n(miss)}건</span></b></div><div class="stat"><small>거절/취소</small><b>${n(r.reject)} / ${n(r.cancel)}</b></div><div class="stat"><small>수락률</small><b>${r.acceptRate}%</b></div></div><div class="times"><div>오전<b>${n(r.morning)}</b></div><div>오후<b>${n(r.afternoon)}</b></div><div>저녁<b>${n(r.evening)}</b></div><div>심야<b>${n(r.midnight)}</b></div></div></div>`}).join('')}
function renderMission(){if(!DATA)return;const cfg=areaCfg(),period=document.getElementById('missionPeriod').value,need=Number(document.getElementById('missionCount').value||0),price=Number(document.getElementById('missionPrice').value||0);let riders=[...(DATA.riders||[])];if(cfg.missionTeam)riders=riders.filter(r=>r.team===cfg.missionTeam);let success=need>0?riders.filter(r=>Number(r[period]||0)>=need):[];success.sort((a,b)=>Number(b[period]||0)-Number(a[period]||0));document.getElementById('missionTarget').innerText=n(riders.length)+'명';document.getElementById('missionSuccess').innerText=n(success.length)+'명';document.getElementById('missionTotal').innerText=won(success.length*price);document.getElementById('missionList').innerHTML=need>0?success.map(r=>`<div class="mission-rider"><b>${r.name}</b><span>${n(r[period])}건 / ${won(price)}</span></div>`).join(''):`<div style="grid-column:1/-1;color:var(--muted);font-weight:1000;text-align:center;padding:16px">목표 건수를 입력하면 성공기사가 표시됩니다.</div>`}
function renderManageList(){
  if(!DATA || !DATA.riders){
    document.getElementById('manageList').innerHTML='기사 데이터가 없습니다.';
    return;
  }

  const teams=areaCfg().teams;
  let riders=[...DATA.riders];

  if(window.manageFilter && window.manageFilter!=='전체'){
    riders=riders.filter(r=>r.team===window.manageFilter);
  }

  document.getElementById('manageList').innerHTML=`
    <div style="display:flex;gap:8px;margin-bottom:12px;flex-wrap:wrap">
      <button class="move" onclick="setManageFilter('전체')">전체</button>
      ${teams.map(t=>`
        <button class="move" onclick="setManageFilter('${t}')">${t}</button>
      `).join('')}
    </div>

    <button class="toggle-btn" onclick="saveTeamMap()">팀 변경 저장</button>

    ${riders.map(r=>`
      <div class="mission-rider">
        <b>${r.name}</b>
        <select data-rider-name="${r.name}" style="border:1px solid var(--line);border-radius:10px;padding:8px;font-weight:1000">
          ${teams.map(t=>`
            <option value="${t}" ${r.team===t?'selected':''}>${t}</option>
          `).join('')}
        </select>
      </div>
    `).join('')}
  `;
}
function setManageFilter(team){
  window.manageFilter=team;
  renderManageList();
}

async function saveTeamMap(){
  const selects=document.querySelectorAll('#manageList select');
  const changes={};

  selects.forEach(sel=>{
    const name=sel.getAttribute('data-rider-name');
    const team=sel.value;
    if(name && team){
      changes[name]=team;
    }
  });

  try{
    const res=await fetch('/api/save-teammap',{
      method:'POST',
      headers:{'Content-Type':'application/json'},
      body:JSON.stringify({
  area: areaCfg().key,
  changes: changes
})
    });

    const result=await res.json();

    if(result.ok){
      alert('팀 변경 저장 완료');
      loadData();
    }else{
      alert('저장 실패: '+result.error);
    }
   }catch(e){
    alert('저장 오류: '+e.message);
  }
}

loadData();
setInterval(loadData,30000);
</script>
