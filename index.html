<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">

<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">

<title>SUPERSONIC 통합 관제판</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<style>
:root{
  --red:#e60012; --blue:#006fd6; --green:#00c853; --purple:#7c3aed;
  --orange:#ff8a00; --text:#111; --muted:#777; --line:#e6e6e6;
  --card:#fff; --bg:#fff; --soft:#f7f7f8;
}
body.dark{
  --text:#fff; --muted:#cfcfcf; --line:#333; --card:#151515; --bg:#080808; --soft:#101010;
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font-family:Arial,'Noto Sans KR',sans-serif}
body.dark{background:linear-gradient(135deg,rgba(0,0,0,.92),rgba(15,15,15,.96)),url('logo.png') right 60px top 90px / 380px auto no-repeat}
.wrap{max-width:920px;margin:0 auto;padding:16px 14px 40px}
.top{position:relative;text-align:center;padding-top:6px}
.move,.mode{border:1px solid var(--line);background:var(--card);color:var(--text);border-radius:10px;padding:10px 14px;font-weight:900}
.move{position:absolute;left:0;top:4px;cursor:pointer}.mode{position:absolute;right:0;top:4px;cursor:pointer}
.logo-img{width:96px}.brand{color:var(--red);font-size:30px;font-weight:1000;font-style:italic;margin-top:4px}
.sub{font-size:15px;font-weight:900}.area{margin:10px 0 6px;text-align:center;font-size:16px;font-weight:900}.area b{color:var(--red)}
.top-update{margin:0 0 16px;font-size:13px;font-weight:900;color:var(--muted);text-align:center}
.area-menu{display:none;position:absolute;left:0;top:50px;background:var(--card);border:1px solid var(--line);border-radius:14px;box-shadow:0 12px 30px rgba(0,0,0,.16);z-index:10;overflow:hidden;min-width:160px}
.area-menu.show{display:block}
.area-menu button{display:block;width:100%;padding:13px 18px;border:0;border-bottom:1px solid var(--line);background:var(--card);color:var(--text);font-weight:900;text-align:left;cursor:pointer}
.area-menu button:last-child{border-bottom:0}
.area-menu button.active{background:var(--red);color:#fff}
.summary{border:2px solid var(--red);border-radius:16px;background:rgba(255,255,255,.82);overflow:hidden;margin-bottom:18px}
body.dark .summary{background:rgba(15,15,15,.78)}
.summary-grid{display:grid;grid-template-columns:repeat(5,1fr)}
.sum{padding:15px 6px;text-align:center;border-right:1px solid var(--line)}.sum:nth-child(5n){border-right:0}.sum.topline{border-bottom:1px solid var(--line)}
.sum-title{font-size:12px;font-weight:900}.sum-val{margin-top:6px;font-size:22px;font-weight:1000}.sum-val.red{color:var(--red)}.sum-val.green{color:var(--green)}.sum-val.orange{color:var(--orange)}
.weekly-bar{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:18px}
.weekly-kpi{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px 16px;box-shadow:0 6px 18px rgba(0,0,0,.05)}
body.dark .weekly-kpi{box-shadow:none;background:rgba(20,20,20,.9)}
.weekly-kpi .label{font-size:13px;font-weight:900;color:var(--muted)}
.weekly-kpi .value{font-size:26px;font-weight:1000;margin-top:6px}
.weekly-kpi .value.red{color:var(--red)}.weekly-kpi .value.green{color:var(--green)}.weekly-kpi .value.orange{color:var(--orange)}
.weekly-actions{display:flex;justify-content:space-between;align-items:center;gap:10px;margin:18px 0 12px}
.weekly-title{font-size:20px;font-weight:1000;display:flex;align-items:center;gap:8px}.weekly-title .icon{color:var(--red)}
.weekly-toggle{border:0;background:var(--red);color:#fff;border-radius:12px;padding:12px 16px;font-weight:1000;cursor:pointer;box-shadow:0 8px 20px rgba(230,0,18,.18)}
.weekly-panel{display:none;margin-bottom:20px}
.weekly-panel.show{display:block}
.weekly-total{display:grid;grid-template-columns:repeat(5,1fr);gap:8px;background:var(--soft);border:1px solid var(--line);border-radius:16px;padding:12px;margin-bottom:12px}
.weekly-total div{text-align:center;font-weight:900;font-size:12px;color:var(--muted)}
.weekly-total b{display:block;margin-top:4px;color:var(--text);font-size:17px}
.weekly-days{display:grid;grid-template-columns:repeat(7,1fr);gap:8px}
.day-card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px 8px;text-align:center;min-height:126px}
.day-card.empty{opacity:.45}
.day-label{font-size:18px;font-weight:1000;color:var(--red)}
.day-date{font-size:11px;color:var(--muted);font-weight:900;margin:3px 0 8px}
.day-row{display:flex;justify-content:space-between;font-size:11px;font-weight:900;margin:4px 0;color:var(--muted)}
.day-row b{color:var(--text)}
.day-rate{margin-top:7px;border-top:1px solid var(--line);padding-top:7px;font-size:13px;font-weight:1000}
.section-title{margin:22px 0 12px;display:flex;align-items:center;gap:8px;font-size:21px;font-weight:1000}.section-title .icon{color:var(--red)}
.period-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:22px}
.period-card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;box-shadow:0 6px 18px rgba(0,0,0,.06)}
body.dark .period-card{box-shadow:none;background:rgba(20,20,20,.9)}
.period-head{font-size:18px;font-weight:1000;margin-bottom:4px}.period-sub{font-size:12px;color:var(--muted);font-weight:900}
.period-total{margin:14px 0 12px;text-align:center;font-size:24px;font-weight:1000}.period-total span:first-child{color:var(--red)}
.total-bar{height:12px;background:#e9e9e9;border-radius:999px;overflow:hidden;margin-bottom:14px}body.dark .total-bar{background:#333}
.total-fill{height:100%;background:var(--red);border-radius:999px}
.team-line{display:grid;grid-template-columns:42px 1fr auto;align-items:center;gap:8px;font-size:13px;font-weight:900;margin:8px 0}
.team-name{font-size:14px}.team-num .done{color:var(--red)}.team-num .goal{color:var(--blue)}
.small-bar{height:10px;background:#ececec;border-radius:999px;overflow:hidden}body.dark .small-bar{background:#333}
.small-fill.sonic{height:100%;background:var(--red)}.small-fill.number{height:100%;background:var(--blue)}.small-fill.maeum,.small-fill.dalseo{height:100%;background:var(--purple)}
.controls{display:flex;justify-content:space-between;align-items:center;gap:10px;margin:20px 0 14px}
.filters{display:flex;gap:10px;flex-wrap:wrap}.filters button{min-width:82px;border:1px solid var(--line);background:var(--card);color:var(--text);border-radius:8px;padding:11px 14px;font-weight:900;cursor:pointer}
.filters button.active{background:var(--red);border-color:var(--red);color:#fff}
.sort{display:flex;align-items:center;gap:8px;font-weight:900}.sort select{border:1px solid var(--line);background:var(--card);color:var(--text);border-radius:8px;padding:11px 16px;font-weight:900}
.riders{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.rider{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px 16px;box-shadow:0 4px 14px rgba(0,0,0,.05)}
.rider.active{background:#eafff1;border:3px solid var(--green);color:#111;box-shadow:0 8px 24px rgba(0,200,83,.20)}
body.dark .rider.active{background:#063b1d;border:3px solid var(--green);color:#fff}
.rider-top{display:flex;justify-content:space-between;align-items:center}.rider-name{font-size:22px;font-weight:1000}
.dot{display:inline-block;width:10px;height:10px;border-radius:999px;background:#bbb;margin-right:8px}.rider.active .dot{background:var(--green)}
.status{font-size:11px;font-weight:900;padding:4px 7px;border-radius:999px;background:#eee;color:#555}.rider.active .status{background:#d9ffe8;color:#006b2c}
.warn{color:#ff9f00;font-size:12px;font-weight:900;margin-left:4px}
.stats{display:grid;grid-template-columns:repeat(3,1fr);margin-top:14px;text-align:center}.stat{border-right:1px solid var(--line)}.stat:last-child{border-right:0}
.stat small{display:block;font-size:12px;font-weight:900}.stat b{display:block;margin-top:4px;font-size:18px}.stat b.red{color:var(--red)}
.times{display:grid;grid-template-columns:repeat(4,1fr);border-top:1px solid var(--line);margin-top:12px;padding-top:10px;text-align:center}
.times div{border-right:1px solid var(--line);font-size:12px;font-weight:900}.times div:last-child{border-right:0}.times b{display:block;color:var(--red);font-size:16px;margin-top:3px}
.footer{display:none}
.error{border:2px solid var(--red);border-radius:16px;padding:18px;text-align:center;font-weight:900;color:var(--red);background:#fff3f3}
body.dark .error{background:#220000}
@media(max-width:760px){
  .summary-grid{grid-template-columns:repeat(3,1fr)}.sum:nth-child(5n){border-right:1px solid var(--line)}.sum:nth-child(3n){border-right:0}
  .period-grid{grid-template-columns:1fr 1fr}.weekly-bar{grid-template-columns:1fr 1fr}.weekly-days{grid-template-columns:repeat(2,1fr)}.weekly-total{grid-template-columns:repeat(2,1fr)}
}
@media(max-width:540px){
  .move,.mode{position:static;margin:4px}.area-menu{left:14px;top:55px}.summary-grid{grid-template-columns:repeat(3,1fr)}
  .period-grid{grid-template-columns:1fr}.riders{grid-template-columns:1fr}.controls{flex-direction:column;align-items:stretch}
  .filters{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}.filters button{min-width:0;padding:10px 4px}.sort{justify-content:flex-end}
  .weekly-bar{grid-template-columns:1fr}.weekly-actions{flex-direction:column;align-items:stretch}.weekly-toggle{width:100%}.weekly-days{grid-template-columns:1fr 1fr}
}
</style>
</head>
<body>
<div class="wrap">
  <div class="top">
    <button class="move" onclick="toggleAreaMenu()">권역이동 ▾</button>
    <div class="area-menu" id="areaMenu"></div>
    <button class="mode" onclick="toggleMode()" id="modeBtn">🌙 다크 모드</button>
    <img src="logo.png" class="logo-img">
    <div class="brand">SUPERSONIC</div>
    <div class="sub">배민 | 쿠팡협력사</div>
    <div class="area">현재 권역 : <b id="areaText">-</b></div>
    <div class="top-update" id="topUpdateTime">↻ 마지막 업데이트 : -</div>
  </div>

  <div id="errorBox"></div>

  <div class="summary">
    <div class="summary-grid">
      <div class="sum topline"><div class="sum-title">총 물량</div><div class="sum-val" id="totalVolume">0</div></div>
      <div class="sum topline"><div class="sum-title">총 발주량</div><div class="sum-val" id="totalOrder">0</div></div>
      <div class="sum topline"><div class="sum-title">총 완료량</div><div class="sum-val" id="totalComplete">0</div></div>
      <div class="sum topline"><div class="sum-title">총 수락률</div><div class="sum-val" id="totalRate">0%</div></div>
      <div class="sum topline"><div class="sum-title">총 여유거절</div><div class="sum-val red" id="totalSpare">0</div></div>
      <div class="sum"><div class="sum-title">당일 완료</div><div class="sum-val red" id="dayComplete">0</div></div>
      <div class="sum"><div class="sum-title">당일 발주량</div><div class="sum-val" id="dayOrder">0</div></div>
      <div class="sum"><div class="sum-title">주간 수락률</div><div class="sum-val" id="weeklyRate">-</div></div>
      <div class="sum"><div class="sum-title">주간 여유거절</div><div class="sum-val red" id="weeklySpare">-</div></div>
      <div class="sum"><div class="sum-title" id="teamCountTitle">접속중</div><div class="sum-val red" id="teamCount">0</div></div>
    </div>
  </div>

  <div class="weekly-bar">
    <div class="weekly-kpi">
      <div class="label">이번 주 완료 / 거절</div>
      <div class="value" id="weeklyCompleteReject">-</div>
    </div>
    <div class="weekly-kpi">
      <div class="label">전체 접속</div>
      <div class="value green" id="onlineCount">0명</div>
    </div>
  </div>

  <div class="weekly-actions">
    <div class="weekly-title"><span class="icon">▮</span> 주간실적 <span id="weeklyRange" style="font-size:13px;color:var(--muted);font-weight:900"></span></div>
    <button class="weekly-toggle" onclick="toggleWeekly()">주간실적 보기 ▾</button>
  </div>
  <div class="weekly-panel" id="weeklyPanel">
    <div class="weekly-total" id="weeklyTotal"></div>
    <div class="weekly-days" id="weeklyDays"></div>
  </div>

  <div class="section-title"><span class="icon">▮</span> 구간별 실적 <span style="font-size:14px;font-weight:900">(완료 / 발주량)</span></div>
  <div class="period-grid" id="periodCards"></div>

  <div class="controls">
    <div class="filters" id="filters"></div>
    <div class="sort">
      정렬:
      <select id="sortSelect" onchange="render()">
        <option value="name" selected>가나다순</option>
        <option value="complete">완료순</option>
      </select>
    </div>
  </div>

  <div class="riders" id="riderGrid"></div>
  <div class="footer" id="footerTime">마지막 업데이트 : -</div>
</div>

<script>
const AREAS={
  "달서A":{file:"data_dalseoa.json", teams:["소닉팀","달서팀"], labels:{"소닉팀":"소닉","달서팀":"달서"}, classes:{"소닉팀":"sonic","달서팀":"dalseo"}},
  "달서B":{file:"data_dalseob.json", teams:["소닉팀","넘버팀","마음팀"], labels:{"소닉팀":"소닉","넘버팀":"넘버","마음팀":"마음"}, classes:{"소닉팀":"sonic","넘버팀":"number","마음팀":"maeum"}},
  "중구A":{file:"data_junggua.json", teams:["소닉팀","넘버팀"], labels:{"소닉팀":"소닉","넘버팀":"넘버"}, classes:{"소닉팀":"sonic","넘버팀":"number"}}
};

let DATA=null;
let CURRENT=localStorage.getItem("selectedArea") || "달서A";
let FILTER="전체";

function n(v){return Number(v||0).toLocaleString()}
function pct(a,b){return !b?0:Math.min(100,Math.round((a/b)*100))}
function areaCfg(){return AREAS[CURRENT]}
function valClass(v){return Number(v) >= 0 ? "green" : "red"}

function toggleAreaMenu(){document.getElementById("areaMenu").classList.toggle("show")}
function selectArea(area){CURRENT=area;FILTER="전체";localStorage.setItem("selectedArea",area);document.getElementById("areaMenu").classList.remove("show");loadData()}
function setFilter(v){FILTER=v;render()}
function toggleWeekly(){document.getElementById("weeklyPanel").classList.toggle("show")}

function toggleMode(){
  document.body.classList.toggle("dark");
  const dark=document.body.classList.contains("dark");
  localStorage.setItem("mode",dark?"dark":"light");
  document.getElementById("modeBtn").innerText=dark?"☀ 라이트 모드":"🌙 다크 모드";
}
if(localStorage.getItem("mode")==="dark"){document.body.classList.add("dark")}

function renderAreaMenu(){
  document.getElementById("areaMenu").innerHTML=Object.keys(AREAS).map(a=>`<button onclick="selectArea('${a}')" class="${a===CURRENT?'active':''}">${a}</button>`).join("");
}

async function loadData(){
  renderAreaMenu();
  try{
    const res=await fetch(areaCfg().file+"?time="+Date.now());
    if(!res.ok) throw new Error(areaCfg().file+" 없음");
    DATA=await res.json();
    document.getElementById("errorBox").innerHTML="";
    render();
  }catch(e){
    DATA=null;
    document.getElementById("errorBox").innerHTML=`<div class="error">${CURRENT} 데이터를 읽지 못했습니다.<br>${areaCfg().file} 업로드를 확인하세요.</div>`;
  }
}

function teamObj(name){return DATA.teams[name] || {summary:{},targets:{}}}

function renderWeekly(d){
  const w=d.weeklySummary || null;

  if(!w){
    document.getElementById("weeklyRate").innerText="-";
    document.getElementById("weeklySpare").innerText="-";
    document.getElementById("weeklyCompleteReject").innerText="-";
    document.getElementById("weeklyRange").innerText="데이터 없음";
    document.getElementById("weeklyTotal").innerHTML=`<div>주간 데이터가 아직 없습니다.</div>`;
    document.getElementById("weeklyDays").innerHTML="";
    return;
  }

  const spareEl=document.getElementById("weeklySpare");
  document.getElementById("weeklyRate").innerText=w.acceptRate+"%";
  spareEl.innerText=n(w.spareRejects);
  spareEl.className="sum-val "+valClass(w.spareRejects);

  document.getElementById("weeklyCompleteReject").innerText=`${n(w.complete)} / ${n(w.reject)}`;
  document.getElementById("weeklyRange").innerText=`${w.startDate} ~ ${w.endDate}`;

  document.getElementById("weeklyTotal").innerHTML=`
    <div>완료<b>${n(w.complete)}</b></div>
    <div>거절<b>${n(w.reject)}</b></div>
    <div>취소<b>${n(w.cancel)}</b></div>
    <div>배달취소<b>${n(w.riderFault)}</b></div>
    <div>수락률<b>${w.acceptRate}%</b></div>
  `;

  document.getElementById("weeklyDays").innerHTML=(w.days||[]).map(day=>`
    <div class="day-card ${day.hasData?'':'empty'}">
      <div class="day-label">${day.label}</div>
      <div class="day-date">${day.businessDate}</div>
      <div class="day-row"><span>완료</span><b>${n(day.complete)}</b></div>
      <div class="day-row"><span>거절</span><b>${n(day.reject)}</b></div>
      <div class="day-row"><span>취소</span><b>${n(day.cancel)}</b></div>
      <div class="day-row"><span>배달취소</span><b>${n(day.riderFault)}</b></div>
      <div class="day-rate">${day.acceptRate}%</div>
    </div>
  `).join("");
}

function render(){
  const d=DATA;if(!d)return;
  const cfg=areaCfg();
  const teams=cfg.teams;
  const totalOrder=teams.reduce((s,t)=>s+(teamObj(t).targets.total||0),0);

  document.getElementById("modeBtn").innerText=document.body.classList.contains("dark")?"☀ 라이트 모드":"🌙 다크 모드";
  document.getElementById("areaText").innerText=d.area || CURRENT;
  document.getElementById("totalVolume").innerText=n(totalOrder);
  document.getElementById("totalOrder").innerText=n(totalOrder);
  document.getElementById("totalComplete").innerText=n(d.total.complete);
  document.getElementById("totalRate").innerText=d.total.acceptRate+"%";
  document.getElementById("totalSpare").innerText=n(d.total.spareRejects);
  document.getElementById("dayComplete").innerText=n(d.total.complete);
  document.getElementById("dayOrder").innerText=n(totalOrder);
  document.getElementById("onlineCount").innerText=n(d.total.onlineCount)+"명";
  document.getElementById("teamCountTitle").innerText="접속중("+teams.map(t=>cfg.labels[t]).join("/")+")";
  document.getElementById("teamCount").innerText=teams.map(t=>n(teamObj(t).summary.onlineCount)).join("/");
  document.getElementById("footerTime").innerText="↻ 마지막 업데이트 : "+d.updatedAt;
  document.getElementById("topUpdateTime").innerText="↻ 마지막 업데이트 : "+d.updatedAt;

  renderWeekly(d);

  const periods=[["morning","☀","오전 피크"],["afternoon","☀","오후 논피크"],["evening","🌇","저녁 피크"],["midnight","🌙","심야 논피크"]];

  document.getElementById("periodCards").innerHTML=periods.map(([key,icon,label])=>{
    const totalDone=teams.reduce((s,t)=>s+(teamObj(t).summary[key]||0),0);
    const totalGoal=teams.reduce((s,t)=>s+(teamObj(t).targets[key]||0),0);
    return `<div class="period-card">
      <div class="period-head">${icon} ${label}</div>
      <div class="period-sub">완료 / 발주량</div>
      <div class="period-total"><span>${n(totalDone)}</span> / <span>${n(totalGoal)}</span></div>
      <div class="total-bar"><div class="total-fill" style="width:${pct(totalDone,totalGoal)}%"></div></div>
      ${teams.map(t=>{
        const done=teamObj(t).summary[key]||0;
        const goal=teamObj(t).targets[key]||0;
        return `<div class="team-line">
          <div class="team-name">${cfg.labels[t]}</div>
          <div class="small-bar"><div class="small-fill ${cfg.classes[t]}" style="width:${pct(done,goal)}%"></div></div>
          <div class="team-num"><span class="done">${n(done)}</span> / <span class="goal">${n(goal)}</span></div>
        </div>`;
      }).join("")}
    </div>`;
  }).join("");

  const filterItems=[["전체","전체"],...teams.map(t=>[t,t])];
  document.getElementById("filters").innerHTML=filterItems.map(([value,label])=>`<button onclick="setFilter('${value}')" class="${FILTER===value?'active':''}">${label}</button>`).join("");

  let riders=[...(d.riders||[])];
  if(FILTER!=="전체") riders=riders.filter(r=>r.team===FILTER);

  const sort=document.getElementById("sortSelect").value;
  if(sort==="name"){
    riders.sort((a,b)=>{
      if(a.isOnline !== b.isOnline) return a.isOnline ? -1 : 1;
      return a.name.localeCompare(b.name,"ko");
    });
  }else{
    riders.sort((a,b)=>{
      if(a.isOnline !== b.isOnline) return a.isOnline ? -1 : 1;
      return b.complete-a.complete;
    });
  }

  document.getElementById("riderGrid").innerHTML=riders.map(r=>`<div class="rider ${r.isOnline?'active':''}">
    <div class="rider-top">
      <div class="rider-name"><span class="dot"></span>${r.name}</div>
      <div><span class="status">${r.isOnline?'접속중':'미접속'}</span>${r.warning?'<span class="warn">80%↓</span>':''}</div>
    </div>
    <div class="stats">
      <div class="stat"><small>완료</small><b class="red">${n(r.complete)}</b></div>
      <div class="stat"><small>거절/취소</small><b>${n(r.reject)} / ${n(r.cancel)}</b></div>
      <div class="stat"><small>수락률</small><b>${r.acceptRate}%</b></div>
    </div>
    <div class="times">
      <div>오전<b>${n(r.morning)}</b></div>
      <div>오후<b>${n(r.afternoon)}</b></div>
      <div>저녁<b>${n(r.evening)}</b></div>
      <div>심야<b>${n(r.midnight)}</b></div>
    </div>
  </div>`).join("");
}

loadData();
setInterval(loadData,30000);
</script>
</body>
</html>
