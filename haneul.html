<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
<meta http-equiv="Pragma" content="no-cache" />
<meta http-equiv="Expires" content="0" />
<title>하늘 관제판</title>
<style>
:root{--bg:#f4f7fb;--card:#fff;--soft:#f8fafc;--text:#101828;--muted:#667085;--line:#e4e7ec;--red:#ef233c;--blue:#2563eb;--green:#12b76a;--orange:#f79009;--purple:#7c3aed;--shadow:0 18px 45px rgba(16,24,40,.08);--radius:24px}
*{box-sizing:border-box}html,body{margin:0}body{background:radial-gradient(circle at top left,#edf6ff 0,#f7f9fc 34%,var(--bg) 100%);color:var(--text);font-family:Arial,'Noto Sans KR',sans-serif;font-weight:800}button,input,select{font-family:inherit}.wrap{max-width:1160px;margin:0 auto;padding:16px 14px 70px}.hero{position:sticky;top:0;z-index:20;background:rgba(244,247,251,.88);backdrop-filter:blur(14px);border-bottom:1px solid rgba(228,231,236,.75);padding:14px 0 12px;margin-bottom:18px}.hero-inner{display:flex;align-items:center;justify-content:space-between;gap:14px}.brand{display:flex;align-items:center;gap:12px}.logo{width:50px;height:50px;border-radius:17px;background:linear-gradient(135deg,var(--red),#ff6b7a);display:grid;place-items:center;color:#fff;font-size:23px;box-shadow:0 14px 28px rgba(239,35,60,.25)}.brand h1{margin:0;font-size:23px;letter-spacing:-.7px}.brand p{margin:4px 0 0;color:var(--muted);font-size:13px}.pill{border:1px solid var(--line);background:var(--card);border-radius:999px;padding:10px 14px;font-size:13px;color:var(--muted);box-shadow:0 8px 20px rgba(16,24,40,.04)}.summary-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:18px}.summary-card{background:var(--card);border:1px solid var(--line);border-radius:20px;padding:16px 14px;min-height:105px;box-shadow:var(--shadow);position:relative;overflow:hidden}.summary-card:before{content:'';position:absolute;right:-26px;top:-26px;width:78px;height:78px;border-radius:50%;background:rgba(37,99,235,.07)}.summary-card.red:before{background:rgba(239,35,60,.09)}.summary-card.green:before{background:rgba(18,183,106,.1)}.summary-title{color:var(--muted);font-size:13px;line-height:1.25}.summary-value{margin-top:12px;font-size:27px;letter-spacing:-1px}.summary-value.red{color:var(--red)}.summary-value.green{color:var(--green)}.summary-value.blue{color:var(--blue)}.section{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow);padding:20px;margin:16px 0}.section-head{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:16px}.section-title{display:flex;align-items:center;gap:10px;font-size:21px;font-weight:1000;letter-spacing:-.5px}.bar{width:8px;height:26px;border-radius:999px;background:var(--red)}.toggle{border:0;background:var(--text);color:#fff;border-radius:14px;padding:12px 16px;font-weight:1000;cursor:pointer}.muted{color:var(--muted)}.hidden{display:none}.week-tabs{display:flex;gap:8px;flex-wrap:wrap;margin:0 0 14px}.week-tab{border:1px solid var(--line);background:#fff;color:var(--text);border-radius:999px;padding:10px 14px;font-size:13px;font-weight:1000;cursor:pointer}.week-tab.active{background:var(--red);border-color:var(--red);color:#fff;box-shadow:0 10px 22px rgba(239,35,60,.18)}.table-wrap{overflow-x:auto}.weekly-table,.team-table{width:100%;border-collapse:separate;border-spacing:0 8px;min-width:780px}.weekly-table th,.team-table th{font-size:12px;color:var(--muted);text-align:center;padding:0 8px 6px;white-space:nowrap}.weekly-table th:first-child,.weekly-table td:first-child,.team-table th:first-child,.team-table td:first-child{text-align:left}.weekly-table td,.team-table td{background:var(--soft);border-top:1px solid var(--line);border-bottom:1px solid var(--line);padding:13px 8px;text-align:center;font-size:14px;white-space:nowrap}.weekly-table td:first-child,.team-table td:first-child{border-left:1px solid var(--line);border-radius:14px 0 0 14px;font-size:16px;font-weight:1000}.weekly-table td:last-child,.team-table td:last-child{border-right:1px solid var(--line);border-radius:0 14px 14px 0}.oktxt{color:var(--green);font-weight:1000}.failtxt{color:var(--red);font-weight:1000}.badge{display:inline-flex;align-items:center;justify-content:center;border-radius:999px;padding:6px 10px;font-size:12px;font-weight:1000}.badge.ok{background:#e8fff3;color:#047a43}.badge.fail{background:#fff0f0;color:#d92d20}.badge.wait{background:#eef2f6;color:#475467}.period-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}.period-card{border:1px solid var(--line);border-radius:20px;background:linear-gradient(180deg,#fff,#fbfcfe);padding:16px}.period-name{font-size:17px}.period-main{font-size:26px;margin:14px 0 6px;letter-spacing:-.5px}.period-main span:first-child{color:var(--red)}.mini{font-size:12px;color:var(--muted)}.progress{height:12px;background:#eef2f6;border-radius:999px;overflow:hidden;margin:12px 0}.fill{height:100%;background:linear-gradient(90deg,var(--red),#ff7988);border-radius:999px}.period-result{border-top:1px solid var(--line);margin-top:13px;padding-top:12px;font-size:14px}.rider-tools{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px}.rider-tools input,.rider-tools select{border:1px solid var(--line);background:#fff;border-radius:14px;padding:13px 14px;font-weight:900}.rider-tools input{flex:1;min-width:180px}.rider-tools button{border:0;background:var(--red);color:#fff;border-radius:14px;padding:13px 16px;font-weight:1000;cursor:pointer}.rider-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}.rider{border:1px solid var(--line);border-radius:18px;background:#fff;padding:14px}.rider.online{border-color:rgba(18,183,106,.55);background:#f0fff7}.rider-top{display:flex;justify-content:space-between;gap:10px;align-items:center}.rider-name{font-size:19px}.status{font-size:12px;border-radius:999px;padding:6px 9px;background:#eef2f6;color:#475467}.online .status{background:#dcfae6;color:#067647}.rider-stats{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin-top:12px}.rstat{border-radius:12px;background:var(--soft);padding:10px 6px;text-align:center}.rstat small{display:block;color:var(--muted);font-size:11px}.rstat b{display:block;margin-top:5px;font-size:15px}.modal{position:fixed;inset:0;background:rgba(15,23,42,.55);z-index:60;display:none;align-items:center;justify-content:center;padding:16px}.modal.show{display:flex}.modal-card{width:min(820px,100%);max-height:86vh;overflow:auto;background:#fff;border-radius:24px;padding:20px;box-shadow:0 24px 80px rgba(0,0,0,.25)}.modal-head{display:flex;justify-content:space-between;gap:12px;align-items:center;margin-bottom:14px}.close{border:0;background:#111827;color:#fff;border-radius:12px;padding:10px 14px;font-weight:1000}.sms-team{border:1px solid var(--line);border-radius:20px;padding:14px;margin:12px 0;background:var(--soft)}.sms-group{border:1px solid var(--line);border-radius:16px;padding:13px;margin:10px 0;background:#fff}.sms-actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}.sms-actions button,.sms-actions a{border:0;background:var(--blue);color:#fff;border-radius:12px;padding:10px 12px;text-decoration:none;font-size:13px;font-weight:1000}.phone-list{word-break:break-all;color:var(--muted);line-height:1.6;font-size:13px}@media(max-width:760px){.wrap{padding:10px 10px 60px}.hero-inner{align-items:flex-start}.brand h1{font-size:20px}.pill{display:none}.summary-grid{grid-template-columns:repeat(3,1fr);gap:7px}.summary-card{min-height:88px;padding:13px 8px;border-radius:16px}.summary-title{font-size:11.5px}.summary-value{font-size:20px;margin-top:10px}.section{padding:16px;border-radius:20px}.period-grid{grid-template-columns:1fr 1fr}.rider-grid{grid-template-columns:1fr}.rider-tools input,.rider-tools select,.rider-tools button{width:100%}}
</style>
</head>
<body>
<div class="wrap">
<header class="hero"><div class="hero-inner"><div class="brand"><div class="logo">S</div><div><h1>하늘 관제판</h1><p id="topUpdate">업데이트 대기중</p></div></div><div class="pill">하늘 전용 UI</div></div></header>
<div id="errorBox"></div>
<section class="summary-grid" id="summaryGrid"></section>
<section class="section"><div class="section-head"><div class="section-title"><span class="bar"></span>이번주 현황 <span class="muted" id="weekRange"></span></div><button class="toggle" onclick="toggleWeekly()" id="weeklyBtn">보기 ▾</button></div><div id="weeklyPanel" class="hidden"><div class="week-tabs" id="weeklyTeamTabs"></div><div class="table-wrap"><table class="weekly-table" id="weeklyTable"></table></div></div></section>
<section class="section"><div class="section-head"><div class="section-title"><span class="bar"></span>시간대별 현황</div><span class="muted">완료 / 발주량</span></div><div class="period-grid" id="periodGrid"></div></section>
<section class="section"><div class="section-head"><div class="section-title"><span class="bar"></span>팀별 현황</div></div><div class="table-wrap"><table class="team-table" id="teamTable"></table></div></section>
<section class="section"><div class="section-head"><div class="section-title"><span class="bar"></span>라이더 현황</div></div><div class="rider-tools"><select id="riderTeamFilter" onchange="renderRiders()"><option value="전체">전체</option><option value="하늘팀">하늘</option></select><input id="riderSearch" placeholder="라이더 이름 검색" oninput="renderRiders()" /><select id="riderSort" onchange="renderRiders()"><option value="complete">완료순</option><option value="reject">거절순</option><option value="name">가나다순</option></select><button onclick="openSmsModal()">단체문자</button></div><div class="rider-grid" id="riderGrid"></div></section>
</div>
<div class="modal" id="smsModal"><div class="modal-card"><div class="modal-head"><div><h2 style="margin:0">단체문자 그룹</h2><p class="muted" style="margin:6px 0 0">하늘팀 전체를 최대 99명씩 A/B/C 그룹으로 나눕니다.</p></div><button class="close" onclick="closeSmsModal()">닫기</button></div><div id="smsGroups"></div></div></div>
<script>
const FIREBASE_BASE='https://supersonic-l-default-rtdb.asia-southeast1.firebasedatabase.app';
const LIVE_PATH='/live/haneul';
const WEEKLY_PATH='/weekly/haneul';
const TEAM='하늘팀';
const UNION='하늘팀';
let WEEK_TEAM=TEAM;
const PERIODS=[['morning','오전'],['afternoon','오후'],['evening','저녁'],['midnight','심야']];
const PERIOD_LABEL={morning:'오전피크',afternoon:'오후논피크',evening:'저녁피크',midnight:'심야논피크'};
let DATA=null,WEEKLY=[];
function num(v){return Number(v||0)}function n(v){return num(v).toLocaleString('ko-KR')}function rate(c,b){c=num(c);b=num(b);return c+b?Math.round((c/(c+b))*1000)/10:100}function spare(c,b){return Math.floor(num(c)*.25)-num(b)}function bad(r){return num(r.reject||r.totalReject)+num(r.cancel||r.totalCancel)+num(r.riderFault)}function pct(a,b){return !num(b)?0:Math.min(100,Math.round(num(a)/num(b)*100))}function riders(){return DATA?.riders||[]}function teamObj(t){return DATA?.teams?.[t]||{summary:{},targets:{},riders:[]}}function teamRiders(t){return riders().filter(r=>r.team===t)}function onlineCount(list){return list.filter(r=>r.isOnline).length}function excluded(r){return num(r.excluded||0)}
function teamSummaryFromRiders(list){const s={complete:0,reject:0,cancel:0,riderFault:0,morning:0,afternoon:0,evening:0,midnight:0,excluded:0,onlineCount:onlineCount(list)};list.forEach(r=>{s.complete+=num(r.complete);s.reject+=num(r.reject);s.cancel+=num(r.cancel);s.riderFault+=num(r.riderFault);s.morning+=num(r.morning);s.afternoon+=num(r.afternoon);s.evening+=num(r.evening);s.midnight+=num(r.midnight);s.excluded+=excluded(r)});s.acceptRate=rate(s.complete,bad(s));s.spareRejects=spare(s.complete,bad(s));return s}
function unionRiders(){return riders().filter(r=>r.team!==TEAM)}function unionSummary(){return DATA?.teams?.[UNION]?.summary||teamSummaryFromRiders(unionRiders())}function successSummary(){return teamObj(TEAM).summary||teamSummaryFromRiders(teamRiders(TEAM))}function currentPeriodLabel(){return DATA?.currentPeriodLabel||PERIOD_LABEL[DATA?.currentPeriod]||'-'}
async function fetchJson(path){const r=await fetch(FIREBASE_BASE+path+'.json?v='+Date.now(),{cache:'no-store'});if(!r.ok)throw new Error(path);const j=await r.json();if(j==null)throw new Error(path+' empty');return j}
async function loadData(){try{DATA=await fetchJson(LIVE_PATH);try{WEEKLY=await fetchJson(WEEKLY_PATH)}catch(e){WEEKLY=DATA.weekly||[]}document.getElementById('errorBox').innerHTML='';renderAll()}catch(e){document.getElementById('errorBox').innerHTML='<div class="section" style="color:var(--red)">하늘 데이터를 읽지 못했습니다. Firebase 업로드 상태를 확인하세요.</div>'}}
function buildWeekly(){let rows=Array.isArray(WEEKLY)?WEEKLY:[];let complete=0,b=0;rows.forEach(r=>{complete+=num(r.totalComplete);b+=bad(r)});return{complete,bad:b,acceptRate:rate(complete,b),spare:spare(complete,b)}}
function renderSummary(){const s=successSummary(),total=DATA.total||{},week=buildWeekly();const cards=[['주간완료',week.complete,'red'],['당일완료',total.complete,'red'],['주간수락률',week.acceptRate+'%','blue'],['여유거절수',total.spareRejects,'green'],['전체접속인원',total.onlineCount+'명','green'],['하늘접속인원',s.onlineCount+'명','green'],['','-',''],['현재시간대',currentPeriodLabel(),'blue'],['','-','']];document.getElementById('summaryGrid').innerHTML=cards.map(c=>`<div class="summary-card ${c[2]||''}"><div class="summary-title">${c[0]||'&nbsp;'}</div><div class="summary-value ${c[2]||''}">${c[1]}</div></div>`).join('')}
function toggleWeekly(){const p=document.getElementById('weeklyPanel'),b=document.getElementById('weeklyBtn');const open=p.classList.toggle('hidden')===false;b.textContent=open?'닫기 ▴':'보기 ▾'}
function dayBase(){if(DATA?.weeklySummary?.days?.length)return DATA.weeklySummary.days;return []}
function periodStatusFinal(key,done,goal){const order=['morning','afternoon','evening','midnight'];const cur=DATA?.currentPeriod||'morning';const passed=order.indexOf(key)<order.indexOf(cur);if(passed){return num(done)>=num(goal)?'<span class="badge ok">성공</span>':'<span class="badge fail">실패</span>'}return '<span class="badge wait">진행중</span>'}
function weeklyStatus(periods){const fails=periods.filter(p=>num(p.goal)>0&&num(p.done)<num(p.goal));if(!fails.length)return '<span class="oktxt">성공</span>';return `<span class="failtxt">실패 ${fails.map(p=>PERIOD_LABEL[p.key]).join(', ')}</span>`}
function periodNumsFromDay(d){return PERIODS.map(([k])=>({key:k,done:num(d[k]),goal:num((d.periodTargets||{})[k])}))}
function teamDaySummary(d,team){const ts=d.teams?.[team];if(ts?.summary)return {summary:ts.summary,targets:ts.targets||d.periodTargets||{}};return {summary:{morning:num(d.morning),afternoon:num(d.afternoon),evening:num(d.evening),midnight:num(d.midnight),complete:num(d.complete),reject:num(d.reject),cancel:num(d.cancel),riderFault:num(d.riderFault),excluded:num(d.excluded),acceptRate:d.acceptRate},targets:d.periodTargets||{}}}
function setWeeklyTeam(team){WEEK_TEAM=team;renderWeekly()}
function weeklyTeamLabel(team){return '하늘'}
function weeklyTeamRow(d,team){
  const x=teamDaySummary(d,team),s=x.summary,t=x.targets;
  const ps=PERIODS.map(([k])=>({key:k,done:num(s[k]),goal:num(t[k])}));
  const failKeys=ps.filter(p=>num(p.goal)>0&&num(p.done)<num(p.goal));
  const result=failKeys.length?`<span class="failtxt">실패 ${failKeys.map(p=>PERIOD_LABEL[p.key]).join(', ')}</span>`:`<span class="oktxt">성공</span>`;
  return `<tr><td>${d.label||''}<br><span class="muted" style="font-size:12px">${d.businessDate||''}</span></td>${ps.map(p=>`<td class="${p.goal>0&&p.done<p.goal?'failtxt':''}">${n(p.done)} / ${n(p.goal)}</td>`).join('')}<td>${n(s.excluded)}</td><td>${result}</td><td>${s.acceptRate??rate(s.complete,bad(s))}%</td></tr>`
}
function renderWeekly(){
  const days=dayBase();
  document.getElementById('weekRange').textContent=DATA?.weeklySummary?`${DATA.weeklySummary.startDate||''} ~ ${DATA.weeklySummary.endDate||''}`:'';
  const tabs=document.getElementById('weeklyTeamTabs');
  if(tabs){tabs.innerHTML=[TEAM].map(t=>`<button class="week-tab ${WEEK_TEAM===t?'active':''}" onclick="setWeeklyTeam('${t}')">${weeklyTeamLabel(t)}</button>`).join('')}
  if(!days.length){document.getElementById('weeklyTable').innerHTML='<tbody><tr><td>주간 데이터가 아직 없습니다.</td></tr></tbody>';return}
  document.getElementById('weeklyTable').innerHTML=`<thead><tr><th>${weeklyTeamLabel(WEEK_TEAM)} / 일자</th><th>오전<br>완료/발주</th><th>오후<br>완료/발주</th><th>저녁<br>완료/발주</th><th>심야<br>완료/발주</th><th>미포함</th><th>결과</th><th>수락률</th></tr></thead><tbody>${days.map(d=>weeklyTeamRow(d,WEEK_TEAM)).join('')}</tbody>`
}
function renderPeriods(){const teams=[TEAM];document.getElementById('periodGrid').innerHTML=PERIODS.map(([k])=>{const done=teams.reduce((sum,t)=>sum+num(teamObj(t).summary?.[k]),0);const goal=teams.reduce((sum,t)=>sum+num(teamObj(t).targets?.[k]),0);return `<div class="period-card"><div class="period-name">${PERIOD_LABEL[k]}</div><div class="period-main"><span>${n(done)}</span> / ${n(goal)}</div><div class="mini">전체 물량 · 완료 / 발주량</div><div class="progress"><div class="fill" style="width:${pct(done,goal)}%"></div></div><div class="period-result">${periodStatusFinal(k,done,goal)}</div></div>`}).join('')}
function teamRow(name,list,summary,targets){const badTotal=bad(summary),acc=summary.acceptRate??rate(summary.complete,badTotal);return `<tr><td>${name}<br><span class="muted" style="font-size:12px">${list.length}명 / 접속 ${onlineCount(list)}명</span></td>${PERIODS.map(([k])=>`<td>${n(summary[k])} / ${n(targets[k])}</td>`).join('')}<td>${acc}%</td><td>${n(summary.spareRejects??spare(summary.complete,badTotal))}</td><td>${n(summary.excluded)}</td></tr>`}
function renderTeams(){const s=successSummary();const st=teamObj(TEAM).targets||{};document.getElementById('teamTable').innerHTML=`<thead><tr><th>팀명 라이더(접속중)</th><th>오전<br>(완료/발주량)</th><th>오후<br>(완료/발주량)</th><th>저녁<br>(완료/발주량)</th><th>심야<br>(완료/발주량)</th><th>수락률</th><th>여유거절</th><th>미포함</th></tr></thead><tbody>${teamRow('하늘팀',teamRiders(TEAM),s,st)}</tbody>`}
function filteredRiders(){let q=document.getElementById('riderSearch')?.value?.trim()||'';let teamFilter=document.getElementById('riderTeamFilter')?.value||'전체';let list=[...riders()];if(teamFilter===TEAM){list=list.filter(r=>r.team===TEAM)}if(q)list=list.filter(r=>String(r.name||'').includes(q));let s=document.getElementById('riderSort')?.value||'complete';list.sort((a,b)=>{if(a.isOnline!==b.isOnline)return b.isOnline-a.isOnline;if(s==='name')return String(a.name).localeCompare(String(b.name),'ko');if(s==='reject')return bad(b)-bad(a);return num(b.complete)-num(a.complete)});return list}
function renderRiders(){document.getElementById('riderGrid').innerHTML=filteredRiders().map(r=>`<div class="rider ${r.isOnline?'online':''}"><div class="rider-top"><div class="rider-name">${r.name}</div><span class="status">${r.isOnline?'접속중':'운행종료'}</span></div><div class="rider-stats"><div class="rstat"><small>완료</small><b>${n(r.complete)}</b></div><div class="rstat"><small>거절</small><b>${n(r.reject)}</b></div><div class="rstat"><small>취소</small><b>${n(r.cancel)}</b></div><div class="rstat"><small>수락률</small><b>${r.acceptRate}%</b></div></div></div>`).join('')||'<div class="muted">검색 결과가 없습니다.</div>'}
function smsGroupHtml(teamName,list){let html=`<div class="sms-team"><h3 style="margin:0 0 10px">${teamName} (${list.length}명)</h3>`;for(let i=0;i<list.length;i+=99){const g=list.slice(i,i+99),label=String.fromCharCode(65+i/99),phones=g.map(x=>x.phone).join(',');html+=`<div class="sms-group"><b>${label}그룹 (${g.length}명)</b><div class="phone-list">${g.map(x=>`${x.name} ${x.phone}`).join(' · ')}</div><div class="sms-actions"><button onclick="copyText('${phones}')">번호 복사</button><a href="sms:${phones}">문자앱 열기</a></div></div>`}return html+'</div>'}
function openSmsModal(){const base=filteredRiders().filter(r=>r.phone).map(r=>({team:TEAM,name:r.name,phone:String(r.phone).replace(/\D/g,'')}));let html=smsGroupHtml('하늘팀',base);document.getElementById('smsGroups').innerHTML=html;document.getElementById('smsModal').classList.add('show')}
function closeSmsModal(){document.getElementById('smsModal').classList.remove('show')}function copyText(t){navigator.clipboard?.writeText(t);alert('복사했습니다.')}
